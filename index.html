const CELLS={corners:[0,4,20,24],x:[0,4,6,8,12,16,18,20,24],plus:[2,7,10,11,12,13,14,17,22],t:[0,1,2,3,4,7,12,17,22],l:[0,5,10,15,20,21,22,23,24],u:[0,4,5,9,10,14,15,19,20,21,22,23,24],frame:[0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24],diamond:[2,6,8,10,12,14,16,18,22],blackout:Array.from({length:25},(_,i)=>i)};
// Last Player Standing uses the same random cards and shared draws as Bingo.
// Called = Sit: a matching number eliminates you. Missed = Sit: no match eliminates you.
const LMS_RULES={hit:'Called number = Sit Down',miss:'Not called = Sit Down'};
const LMS_SOURCES={card:'Any number on my card',number:'My single lucky number'};
const isStandingStage=stage=>stage?.gameType==='laststanding';
const START_STAGES=[
 {id:'stage1',name:'First Line Prize',pattern:'line',eligibility:'all',limit:1,approval:'auto',markMode:'auto',prizeAmount:0,prizeDistribution:'each'},
 {id:'stage2',name:'Letter X Prize',pattern:'x',eligibility:'all',limit:3,approval:'auto',markMode:'hybrid',prizeAmount:0,prizeDistribution:'each'},
 {id:'stage3',name:'Four Corners Prize',pattern:'corners',eligibility:'new',limit:3,approval:'auto',markMode:'auto',prizeAmount:0,prizeDistribution:'each'},
 {id:'stage4',name:'Grand Prize — Blackout',pattern:'blackout',eligibility:'all',limit:1,approval:'auto',markMode:'auto',prizeAmount:0,prizeDistribution:'each'}
];
const $=s=>document.querySelector(s);const el=id=>document.getElementById(id);
const S={mode:'demo',role:'',uid:'',roomId:'',room:null,player:null,auth:null,db:null,ref:null,pollTimer:null,watch:null,marks:new Set(),lastWinKey:'',lastReset:-1,winnerToastTimer:null,actionBusy:false,stageDraft:null,busy:false,reconciling:false,notice:'',lastQrUrl:'',fetchErrors:0,publicRef:null,publicEtag:null,syncType:'',hostSignature:'',guestSignature:'',prevBall:null,focusMode:'',soundOn:false,voiceOn:false,audioContext:null};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const friendlyError=e=>{const msg=String(e?.message||e);return /firebase|database|sdk|permission.denied|auth\/|http 40|http 50/i.test(msg)?'Unable to connect. Ask the host to check the game setup.':msg};
const randomInt=n=>{if(window.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n)};
const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=randomInt(i+1);[out[i],out[j]]=[out[j],out[i]];}return out};
const code=()=>Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randomInt(32)]).join('');
const ball=n=>n?('BINGO'[Math.floor((Number(n)-1)/15)]+'-'+n):'—';
const cardKey=a=>a.join(',');
function makeCard(){const a=Array(25).fill(0);for(let c=0;c<5;c++){const p=shuffle(Array.from({length:15},(_,i)=>i+1+15*c));for(let r=0;r<5;r++)a[r*5+c]=p[r];}a[12]=0;return a}
function isPattern(card,called,pat,marks){if(!Array.isArray(card)||card.length!==25)return false;const has=i=>i===12||((called.has(card[i]))&&(!marks||marks.has(i)));const lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c));const diag=[[0,6,12,18,24],[4,8,12,16,20]];let patterns=CELLS[pat]?[CELLS[pat]]:pat==='line'?[...lines,...diag]:pat==='row'?lines.slice(0,5):pat==='col'?lines.slice(5):pat==='diagonal'?diag:[];return patterns.some(p=>p.every(has))}
function makeRoom(id,uid){return {hostUid:uid,createdAt:Date.now(),players:{},claims:{},winners:{},candidates:{},stages:clone(START_STAGES),public:{code:id,status:'lobby',called:[],stageIndex:0,last:null,playerCount:0,resetVersion:0,updatedAt:Date.now(),winnerList:[],stageStartDrawCount:0,stage:clone(START_STAGES[0])}}}
const currentStage=r=>r?.stages?.[r.public.stageIndex]||null;

// Stage awards are shown as peso amounts throughout the game.
const prizeLine=st=>{
 const value=Number(st?.prizeAmount);
 return Number.isFinite(value)&&value>0?'₱'+value.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
};
const prizeBadge=st=>{
 const amount=prizeLine(st);
 if(!amount)return '';
 const perWinner=st?.prizeDistribution!=='pool';
 return `<span class="prize-amount" aria-label="${perWinner?'Amount per winner':'Total prize pool'}: ${safe(amount)}"><strong>${safe(amount)}</strong><small>${perWinner?'per winner':'total prize pool'}</small></span>`;
};
const players=r=>Object.entries(r?.players||{}).filter(([,p])=>Array.isArray(p.card)&&p.card.length===25).map(([uid,p])=>({...p,uid}));
const roundVersion=pub=>Number(pub?.resetVersion)||0;
const validRoundAward=(w,pub)=>!!w&&(w.resetVersion===undefined||w.resetVersion===null||Number(w.resetVersion)===roundVersion(pub));
const validRoundClaim=(claim,pub)=>!!claim&&Number(claim.resetVersion??0)===roundVersion(pub);
const awardList=(r,stageId)=>Object.values(r?.winners?.[stageId]||{}).filter(w=>validRoundAward(w,r?.public)).sort((a,b)=>(a.drawCount||0)-(b.drawCount||0));
const allWinners=r=>Object.values(r?.winners||{}).flatMap(x=>Object.values(x||{})).filter(w=>validRoundAward(w,r?.public));
const oldWinners=(r,stageIndex)=>r.stages.slice(0,stageIndex).some(st=>Object.keys(r.winners?.[st.id]||{}).length>0);
const isEligible=(r,p,stage)=>{const prior=r.stages.slice(0,r.public.stageIndex).some(st=>awardList(r,st.id).some(w=>w.uid===p.uid));return stage.eligibility==='all'||(stage.eligibility==='new'&&!prior)||(stage.eligibility==='previous'&&prior)};
const trimName=s=>String(s||'').trim().replace(/\s+/g,' ').slice(0,30);
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k,d=null)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};

const demoKey=id=>'bingolive_demo_'+id;
function stageLabel(s){return s?`${isStandingStage(s)?'Last Player Standing · '+(LMS_RULES[s.lmsRule]||LMS_RULES.hit):PATS[s.pattern]||s.pattern} · ${s.eligibility==='all'?'Everyone':s.eligibility==='new'?'New winners only':'Past winners only'}`:'No stage'}
// Only calls made after this stage started affect elimination. Older Bingo draws stay visible.
function standingSurvivors(room,drawCount){
 const pub=room?.public||{},st=pub.stage||currentStage(room);
 if(!isStandingStage(st))return [];
 const start=Math.max(0,Number(pub.stageStartDrawCount)||0);
 const draws=(pub.called||[]).slice(start,drawCount===undefined?undefined:Math.max(start,drawCount));
 return players(room).filter(p=>{
  if(!isEligible(room,p,st))return false;
  const lucky=Number(p.luckyNumber)||Number(p.card?.[p.slot%25===12?0:p.slot%25])||0;
  return draws.every(n=>{
   const matches=st.lmsSource==='number'?lucky===n:p.card.includes(n);
   return st.lmsRule==='miss'?matches:!matches;
  });
 });
}
function standingStageCalls(pub){return Math.max(0,(pub.called||[]).length-(Number(pub.stageStartDrawCount)||0))}
function standingGuestState(pub,p){
 const st=pub.stage;
 if(!isStandingStage(st)||!p?.card)return '';
 const draws=(pub.called||[]).slice(Math.max(0,Number(pub.stageStartDrawCount)||0));
 if(!draws.length)return 'Ready to stand';
 const lucky=Number(p.luckyNumber)||Number(p.card?.[p.slot%25===12?0:p.slot%25])||0;
 const sitting=draws.some(n=>{const match=st.lmsSource==='number'?lucky===n:p.card.includes(n);return st.lmsRule==='miss'?!match:match});
 return sitting?'SIT DOWN · Eliminated':'STILL STANDING';
}
function standingGuestHTML(pub,p){
 if(!isStandingStage(pub.stage))return '';
 const status=standingGuestState(pub,p),sitting=status.includes('SIT DOWN');
 return `<div class="standing-guest-status ${sitting?'eliminated':'active'}" id="standing-guest-status"><strong>${safe(status)}</strong><span>${pub.stage.lmsSource==='number'?'Your lucky number: '+ball(Number(p?.luckyNumber)||0):'Your whole card counts'} · ${pub.stage.lmsRule==='miss'?'No match? Sit down.':'Match? Sit down.'}</span></div>`;
}

const GUIDE_VARIANTS={
 line:[...Array.from({length:5},(_,r)=>[0,1,2,3,4].map(c=>r*5+c)),...Array.from({length:5},(_,c)=>[0,1,2,3,4].map(r=>r*5+c)),[0,6,12,18,24],[4,8,12,16,20]],

  const direction=st.lmsRule==='miss'?'Stay standing only if your card/number MATCHES the latest ball. If it does NOT match, sit down.':'Stay standing if the new ball does NOT appear on your card/number. If it MATCHES, sit down.';
  const source=st.lmsSource==='number'?'Watch only your personal lucky number.':'Check all 24 numbers on your Bingo card. FREE does not count as a drawn number.';

 }

function receiveRoom(r){
 if(!r){toast('Room was not found or is no longer available.',true);return}
 const old=S.room;
 const oldEpoch=roundVersion(old?.public),newEpoch=roundVersion(r.public);
 // Ignore late requests from before a host reset, especially on phones using polling.
 if(old&&newEpoch<oldEpoch)return;
 if(old&&newEpoch===oldEpoch&&Number(r.public?.updatedAt||0)<Number(old.public?.updatedAt||0))return;
 const resetArrived=!!old&&newEpoch>oldEpoch;
 if(resetArrived){
  if(S.drawSuspenseActive)cancelDrawAnimation();S.pendingCelebration=null;
  clearWinnerScreen();
  if(el('modal-root')?.querySelector('[data-win-modal]'))el('modal-root').innerHTML='';

 }
 const newDraw=old&&!resetArrived&&r.public?.last&&r.public.last!==old.public?.last&&(r.public.called||[]).length>(old.public?.called||[]).length;
 if(newDraw){if(S.role==='host'&&S.drawSuspenseActive){S.drawAwaitedNumber=Number(r.public.last);setTimeout(finishDrawAnimation,0)}else{playDrawSound();announceNumber(Number(r.public.last))}}
 if(old&&S.role==='host'&&!resetArrived){
  const sid=r.public?.stage?.id;
  const oldIds=new Set(awardList(old,sid).map(w=>w.uid));
  const fresh=awardList(r,sid).filter(w=>!oldIds.has(w.uid));
  if(fresh.length){if(S.drawSuspenseActive)S.pendingCelebration={list:fresh,stage:r.public?.stage};else celebrateHost(fresh,r.public?.stage)}
 }
 S.room=r;S.stageDraft=S.stageDraft||null;
 if(S.role==='player'&&S.mode==='demo')S.player=r.players?.[S.uid]||null;
 syncMarks();
 if(S.role==='player'){
  const sig=JSON.stringify([S.player?.card?.join(','),r.public?.stage?.id,r.public?.stage?.gameType,r.public?.stage?.lmsRule,r.public?.stage?.lmsSource,r.public?.stage?.prizeAmount,r.public?.stage?.prizeDistribution,S.uid]);
  if(el('guest-board')&&sig===S.guestSignature)updateGuestUI();else renderGuest();
 }else if(S.role==='host'){
  const sig=JSON.stringify([r.public.stageIndex,r.public.status,Object.keys(r.players||{}).length,players(r).length,Object.values(r.winners||{}).flatMap(x=>Object.keys(x||{})).length,Object.keys(r.candidates||{}).length,r.stages?.length,newEpoch]);
  if(el('host-last-ball')&&sig===S.hostSignature)updateHostUI();else{renderHost();S.hostSignature=sig;syncFocusMode()}
  clearTimeout(S.reconcileTimer);S.reconcileTimer=setTimeout(reconcileHost,90);
 }else render();
}

function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(Error('Could not connect. Check your internet connection.'));document.head.appendChild(s)})}
async function firebaseReady(){
  if(!onlineConfigured())throw Error('Live play has not been set up yet.');
  if(!window.firebase?.apps){
    if(!firebaseLoading)firebaseLoading=(async()=>{
      const base='https://www.gstatic.com/firebasejs/13.3.0/';
      await loadScript(base+'firebase-app-compat.js');
      await loadScript(base+'firebase-auth-compat.js');
      await loadScript(base+'firebase-database-compat.js');
    })().catch(e=>{firebaseLoading=null;throw e});

function liveErrorDetails(err){
 const message=String(err?.code||'')+' '+String(err?.message||err||'');
 if(/not.configured|not.set.up|live_not_ready/i.test(message))return {title:'Live game is not ready',explanation:'This website is missing its live-game connection settings.',hint:'Keep your existing configured firebase-config.js file when updating the game. If you have not set it up, follow README-SETUP.txt first.',retry:false};
 if(/auth\/.*(operation-not-allowed|configuration-not-found)/i.test(message))return {title:'Guest sign-in is not enabled',explanation:'Your live game connection is there, but guest access is disabled.',hint:'Open your Firebase project → Authentication → Sign-in method → enable Anonymous.',retry:true};
 if(/permission.denied|PERMISSION_DENIED|permission_denied/i.test(message))return {title:'Game room access was blocked',explanation:'Your live game was reached, but it did not allow room creation.',hint:'Check the Realtime Database rules. Publish the rules included in the game package, then try again.',retry:true};
 if(/auth\/.*(invalid-api-key|invalid-app-credential)|invalid.api.key|invalid.database.url/i.test(message))return {title:'Live game settings need fixing',explanation:'One or more connection settings are incorrect.',hint:'Compare your Firebase web app settings with firebase-config.js. Keep the exact database URL.',retry:true};
 if(/timeout|timed.out/i.test(message))return {title:'Connection is taking too long',explanation:'The live room could not be confirmed. No room has been announced as ready.',hint:'Check your internet connection and try again. A slow connection can delay creation.',retry:true};
 if(/network|failed.to.fetch|script|could.not.connect|internet/i.test(message))return {title:'Cannot connect right now',explanation:'Your device could not reach the live game service.',hint:'Check your internet connection, then try again.',retry:true};
 return {title:'Could not start the live game',explanation:'The game could not confirm that your room is ready.',hint:'Check your game settings and live database permissions. If it happens again, open Error details below.',retry:true};
}

async function createRoom(mode){
 if(S.busy)return;
 // Do not silently return to the home screen if the existing connection file is unconfigured.
 if(mode==='firebase'&&!onlineConfigured()){liveCreationFailed(Error('live_not_ready: Firebase settings missing from firebase-config.js'));return}
 S.busy=true;
 if(mode==='firebase')liveProgress();
 try{
  S.mode=mode;S.role='host';S.soundOn=load('bingolive_sound_host',true);S.voiceOn=load('bingolive_voice',false);
  S.roomId=code();S.room=null;S.lastQrUrl='';S.stageDraft=null;S.focusMode='';
  if(mode==='demo'){
   S.uid='host_'+code();setDemoRoom(S.roomId,makeRoom(S.roomId,S.uid));watchDemo();
  }else{
   await withinSeconds(authorize(),18);
   liveStatus('Creating your Bingo room…');
   S.db=firebase.database();
   let done=false;
   for(let i=0;i<5&&!done;i++){
    const id=i?code():S.roomId;
    try{await withinSeconds(S.db.ref('rooms/'+id).set(makeRoom(id,S.uid)),18);S.roomId=id;done=true}
    catch(e){if(/permission.denied|PERMISSION_DENIED/i.test(String(e)))throw e;if(i===4)throw e}
   }
   if(!done)throw Error('Unable to create a unique room.');
   watchHost();
  }
  sessionSave();
  el('modal-root').innerHTML='';
  render();
  toast('Your room is ready! Share the QR code to invite guests.');
 }catch(e){
  console.error('Bingo Live room creation:',e);
  if(S.ref){S.ref.off();S.ref=null}
  S.role='';S.room=null;S.roomId='';S.uid='';
  renderLanding();
  liveCreationFailed(e);
 }finally{S.busy=false}
}

async function submitClaim(){const r=S.room,st=r.public.stage;if(!S.player?.card||isStandingStage(st)||st?.markMode!=='manual'||r.public.status!=='playing')return toast('Manual BINGO is not enabled right now.',true);const called=new Set(r.public.called||[]);if(!isPattern(S.player.card,called,st.pattern,S.marks))return toast('Not BINGO yet. Check your called and marked numbers!',true);const claim={stageId:st.id,resetVersion:roundVersion(r.public),drawCount:r.public.called.length,marks:[...S.marks],at:Date.now()};try{if(S.mode==='demo')patchDemo({['claims/'+S.uid]:claim});else await rest('rooms/'+S.roomId+'/claims/'+S.uid,'PUT',claim);toast('BINGO claim submitted! Waiting for host verification.')}catch(e){toast('Could not send BINGO: '+friendlyError(e),true)}}
function findNewAwards(r){
 const st=currentStage(r),drawn=r.public.called||[];
 if(!st||r.public.status!=='playing')return {awards:[],rejections:[],cleared:[]};
 if(isStandingStage(st)){
  if(!(r.public.called||[]).length||standingStageCalls(r.public)===0||awardList(r,st.id).length)return {awards:[],rejections:[],cleared:[]};
  const survivors=standingSurvivors(r),past=standingSurvivors(r,(r.public.called||[]).length-1);
  // If the last draw eliminates every finalist, the previous finalists tie.
  const finalists=survivors.length===1?survivors:survivors.length===0&&past.length<=5?past:[];
  return {awards:finalists.length?finalists.map(p=>({resetVersion:roundVersion(r.public),uid:p.uid,name:p.name,stageId:st.id,stageName:st.name,prizeAmount:Number(st.prizeAmount)||0,prizeDistribution:st.prizeDistribution||'each',drawCount:(r.public.called||[]).length,at:Date.now(),lastStanding:true,simultaneousTie:survivors.length===0})):[],rejections:[],cleared:[]};
 }

 if(reached&&st.markMode!=='manual')return {awards:[],rejections:[],cleared:[]};
 // A delayed manual claim may still tie with the cutoff draw, rather than
 // being denied only because another guest's internet request arrived first.
 const cutoff=reached?have[Math.min(st.limit,have.length)-1].drawCount:Infinity;
 const awards=[],rejections=[],cleared=[];
 for(const p of players(r)){
  if(!isEligible(r,p,st)||awardList(r,st.id).some(w=>w.uid===p.uid)||(r.candidates?.[p.uid]&&validRoundAward(r.candidates[p.uid],r.public)))continue;
  const claim=r.claims?.[p.uid];
  if(st.markMode==='manual'&&(!claim||claim.stageId!==st.id||!validRoundClaim(claim,r.public)))continue;
  const drawCount=st.markMode==='manual'?Math.max(0,Math.min(drawn.length,Number(claim.drawCount??drawn.length))):drawn.length;
  if(claim&&claim.stageId===st.id&&validRoundClaim(claim,r.public))cleared.push(p.uid);
  if(drawCount>cutoff)continue;
  const marks=st.markMode==='manual'?new Set(claim.marks||[]):null;
  const won=isPattern(p.card,new Set(drawn.slice(0,drawCount)),st.pattern,marks);
  if(won)awards.push({resetVersion:roundVersion(r.public),uid:p.uid,name:p.name,stageId:st.id,stageName:st.name,prizeAmount:Number(st.prizeAmount)||0,prizeDistribution:st.prizeDistribution||'each',drawCount,at:Date.now()});

}
async function reconcileHost(){if(S.reconciling||S.actionBusy||S.role!=='host'||!S.room)return;S.reconciling=true;try{const r=S.room;const missingLuck=Object.entries(r.players||{}).filter(([,p])=>Array.isArray(p.card)&&!Number(p.luckyNumber));

 const missingSlots=Object.entries(r.players||{}).filter(([,p])=>Array.isArray(p.card)&&!p.slot);if(missingSlots.length){const taken=new Set(Object.values(r.players||{}).map(p=>Number(p.slot)||0));const fixes={};let next=1;for(const [uid] of missingSlots){while(taken.has(next))next++;fixes['players/'+uid+'/slot']=next;taken.add(next)}await patchHost(fixes);return}const pending=Object.entries(r.players||{}).filter(([,p])=>!p.card&&!p.rejected);if(pending.length){const unique=new Set(players(r).map(p=>cardKey(p.card))),changes={};let count=players(r).length;for(const [uid] of pending){if(count>=100){changes['players/'+uid+'/rejected']=true;continue}let card,tries=0;do{card=makeCard();tries++}while(unique.has(cardKey(card))&&tries<50);unique.add(cardKey(card));changes['players/'+uid+'/card']=card;changes['players/'+uid+'/luckyNumber']=1+randomInt(75);changes['players/'+uid+'/slot']=count+1;count++}changes['public/playerCount']=count;changes['public/updatedAt']=Date.now();await patchHost(changes);return}const {awards,rejections,cleared}=findNewAwards(r);if(!awards.length&&!cleared.length)return;const st=currentStage(r),changes={};for(const uid of cleared){changes['claims/'+uid]=null;if(rejections.includes(uid))changes['players/'+uid+'/claimFeedback']='Invalid BINGO. Mark only officially called numbers.'}if(awards.length){if(st.approval==='auto'){for(const w of awards)changes[`winners/${st.id}/${w.uid}`]=w;changes['public/winnerList']=[...awardList(r,st.id),...awards].sort((a,b)=>a.drawCount-b.drawCount)}else{for(const w of awards)changes['candidates/'+w.uid]=w}}if(Object.keys(changes).length&&!S.actionBusy&&roundVersion(S.room?.public)===roundVersion(r.public))await patchHost(changes)}catch(e){toast('Having trouble updating the game. Retrying…',true)}finally{S.reconciling=false}}

 else toast(message,true);
}
async function leave(){stopGuestSync();S.focusMode='';syncFocusMode();if(S.ref){S.ref.off();S.ref=null}window.removeEventListener('storage',onDemoStorage);S.role='';S.room=null;S.roomId='';S.stageDraft=null;S.player=null;S.marks=new Set();try{sessionStorage.removeItem('bingolive_session')}catch(e){}if(location.search){history.replaceState(null,'',location.pathname)}render()}
async function runAct(act,btn){if(act==='closemodal'){el('modal-root').innerHTML='';return}if(act==='showqr')return toggleJoinQR();if(act==='themes')return showThemePicker();if(act==='stagemanager')return showStageManager();if(act==='standing-roster')return showStandingRoster();if(act==='picktheme'){if(HOST_PALETTES[btn.dataset.theme]){S.palette=btn.dataset.theme;store('bingolive_palette',S.palette);applyTheme();showThemePicker()}return}if(act==='pickappearance'){if(['dark','light'].includes(btn.dataset.appearance)){S.appearance=btn.dataset.appearance;store('bingolive_appearance',S.appearance);applyTheme();showThemePicker()}return}if(act==='closewinner'||act==='winner-keep'){clearWinnerScreen();return}
if(act==='winner-next'){clearWinnerScreen();return hostAction('nextstage')}
if(act==='winner-reset'){return confirmDialog('Reset everything to ZERO?','All called numbers, current winners, and ALL guest marks will be cleared. Every guest keeps the SAME card. Drawing will NOT restart until you press Start.','Reset to zero',async()=>{clearWinnerScreen();await hostAction('resetdraws')})}if(act==='leave')return leave();if(act==='pattern-info')return showPatternGuide();if(act==='guide-prev')return showPatternGuide((S.guidePage||0)-1);if(act==='guide-next')return showPatternGuide((S.guidePage||0)+1);if(act==='sound'||act==='voice')return soundAction(act);if(act==='focus-host')return toggleFocus('host');if(act==='focus-guest')return toggleFocus('guest');if(act==='create-live'||act==='retry-live')return createRoom('firebase');if(act==='create-demo'){el('modal-root').innerHTML='';return createRoom('demo')};if(act==='copylink'){try{await navigator.clipboard.writeText(joinLink());toast('Join link copied!')}catch(e){prompt('Copy this link:',joinLink())}return}if(S.role==='player'){if(act==='mark'){const idx=Number(btn.dataset.index),n=S.player?.card?.[idx];if(!n||!S.room?.public.called?.includes(n))return;if(S.marks.has(idx))S.marks.delete(idx);else S.marks.add(idx);store(`bingolive_marks_${S.roomId}_${S.uid}`,{version:S.room.public.resetVersion,marks:[...S.marks]});updateGuestUI();return}if(act==='claim')return submitClaim();return}
if(S.role!=='host')return;
if(act==='addstage'){S.stageDraft={name:'New Prize Stage',gameType:'bingo',lmsRule:'hit',lmsSource:'card',pattern:'blackout',eligibility:'all',limit:1,markMode:'auto',approval:'auto',prizeAmount:0,prizeDistribution:'each'};showStageEditor();return}
if(act==='editstage'){const i=Number(btn.dataset.index);if(!S.room.stages[i])return;S.stageDraft={...S.room.stages[i],editIndex:i};showStageEditor();return}
if(act==='cancelstage'){S.stageDraft=null;el('modal-root').innerHTML='';return}
if(act==='resetdraws')return confirmDialog('Reset Draws?','Clear ALL called numbers and ALL guest marks (including manual marks), then return to Stage 1. Everyone keeps the SAME Bingo card numbers. Previous prize results are saved in Past Winners.','Reset to zero',async()=>{clearWinnerScreen();await hostAction('resetdraws')});
if(act==='end')return confirmDialog('End Event?','The event will stop. Player cards, drawn numbers and winner history will remain saved.','End Event',()=>hostAction('end'));
if(act==='selectstage'){const n=Number(btn.dataset.index);return confirmDialog('Switch prize stage?','Current card assignments, marked numbers, and all drawn balls will remain intact.','Continue',()=>hostAction('selectstage',n))}
if(act==='nextstage')return confirmDialog('Continue to next prize?','Use existing drawn numbers and the same cards. All eligible cards will be checked against the next pattern.','Continue',()=>hostAction('nextstage'));
if(act==='draw'){if(S.drawBusy||S.drawSuspenseActive||S.room?.public.status!=='playing')return;audioReady();S.drawBusy=true;beginDrawAnimation();try{return await hostAction(act)}finally{S.drawBusy=false}}return hostAction(act)
}
applyTheme();
document.addEventListener('keydown',e=>{
 if(e.code==='Escape'&&el('modal-root')?.querySelector('.overlay')){e.preventDefault();el('modal-root').innerHTML='';return}
 if(S.role!=='host'||!S.room||e.altKey||e.ctrlKey||e.metaKey)return;
 const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
 if(e.code==='KeyQ'&&!typing){e.preventDefault();toggleJoinQR();return}
 if(document.querySelector('.overlay')||typing||document.querySelector('.winner-celebration'))return;
 if(e.code==='Space'){e.preventDefault();if(S.room.public.status==='playing')runAct('draw',null)}
 else if(e.code==='KeyP'){e.preventDefault();if(['playing','paused'].includes(S.room.public.status))runAct('togglepause',null)}
 else if(e.code==='KeyR'){e.preventDefault();runAct('resetdraws',null)}
 else if(e.code==='KeyN'||e.code==='ArrowRight'){e.preventDefault();if(S.room.public.stageIndex<S.room.stages.length-1)runAct('nextstage',null)}
 else if(e.code==='KeyT'){e.preventDefault();runAct('themes',null)}
 else if(e.code==='KeyI'){e.preventDefault();runAct('pattern-info',null)}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();runAct(b.dataset.act,b).catch(err=>toast(err.message,true))}});
document.addEventListener('change',e=>{if(e.target?.name==='gameType')syncStageEditorFields()});
document.addEventListener('submit',e=>{if(e.target.id==='join-form'){e.preventDefault();const f=new FormData(e.target);const name=trimName(f.get('name')),id=String(f.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!id||!name)return toast('Enter your room code and name.',true);joinRoom(id,name,detectJoinMode(id))}if(e.target.id==='stage-form'){e.preventDefault();saveStage(e.target)}});
(async function boot(){const params=new URLSearchParams(location.search);const session=(()=>{try{return JSON.parse(sessionStorage.getItem('bingolive_session'))}catch(e){return null}})();if(session?.role==='host'&&session?.roomId){S.mode=session.mode;S.role='host';S.soundOn=load('bingolive_sound_host',true);S.voiceOn=load('bingolive_voice',false);S.roomId=session.roomId;try{if(S.mode==='demo'){S.uid=demoRead(S.roomId)?.hostUid;watchDemo()}else{await authorize();S.db=firebase.database();watchHost()}return}catch(e){toast('Could not restore your game. Please try again.',true);S.role=''}}if(session?.role==='player'&&session?.roomId){S.mode=session.mode;S.role='player';S.soundOn=load('bingolive_sound_player',false);S.roomId=session.roomId;try{if(S.mode==='demo'){const room=demoRead(S.roomId);if(!room)throw Error('Demo room missing');S.uid=session.uid;if(!S.uid)throw Error('Missing guest identity');S.player=room.players[S.uid];watchDemo()}else{await authorize();S.player=await rest('rooms/'+S.roomId+'/players/'+S.uid);startPolling()}return}catch(e){S.role=''}}render();if(params.has('room'))setTimeout(()=>el('name-input')?.focus(),150)})();
</script>
</body>
