<style>
:root{color-scheme:dark;--bg:#080e1b;--panel:#131d31;--panel2:#1a2840;--line:#2e405e;--txt:#f3f6fd;--muted:#aab8d0;--gold:#f5c85a;--teal:#3ed4c6;--red:#ff7d85;--blue:#829bff;--radius:18px}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 8% 8%,#1a3151 0,transparent 41%),radial-gradient(ellipse at 85% 4%,#3b2c32 0,transparent 34%),var(--bg);color:var(--txt)}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffdc8c;outline-offset:2px}a{color:var(--gold)}p{line-height:1.55}.shell{max-width:1510px;margin:auto;padding:22px 28px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.logo{display:flex;align-items:center;gap:12px;font-weight:1000;letter-spacing:.08em;font-size:21px}.logo-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,var(--gold),#ee8349);font-weight:1000;color:#121c30;box-shadow:0 6px 25px #c8873445}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.19em;font-size:12px;font-weight:900}.heading{font-size:clamp(32px,5vw,60px);line-height:1.05;letter-spacing:-.05em;margin:8px 0 18px;max-width:800px}.section-title{font-size:19px;font-weight:800;margin:0}.card{background:linear-gradient(160deg,#19263cda,#111c30ed);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 40px #02071336;min-width:0}.pad{padding:22px}.stack{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.btn{background:linear-gradient(120deg,var(--gold),#f9ac50);color:#1b2230;border:1px solid #ffcf72;padding:12px 19px;border-radius:12px;font-weight:850;min-height:44px;transition:transform .12s,filter .12s;white-space:normal;text-align:center}.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}.btn.secondary{background:#283a56;color:#f8faff;border-color:#405779}.btn.ghost{background:transparent;color:#cfdaed;border-color:#405779}.btn.danger{background:#642839;color:white;border-color:#a9495c}.btn.mini{padding:7px 11px;min-height:33px;font-size:12px}.btn.block{width:100%}.input,.select{width:100%;background:#0b1629;color:white;border:1px solid #435879;border-radius:11px;padding:12px 14px;min-height:44px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:800;color:#c1cee4}.pill{background:#23334b;border:1px solid #3b5170;border-radius:99px;padding:7px 11px;color:#d6e1f2;font-size:12px;font-weight:750}.pill.green{background:#17423b;border-color:#307f6c;color:#9effe9}.pill.gold{background:#594428;border-color:#987341;color:#ffe6a7}.pill.red{background:#56313a;border-color:#944651;color:#ffc0c4}.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.feature{padding:16px;background:#121e32;border:1px solid #30405d;border-radius:14px}.feature strong{display:block;color:var(--gold);margin-bottom:5px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.radio-tile{display:block;padding:11px;background:#0b172b;border:1px solid #354a6a;border-radius:12px;cursor:pointer}.radio-tile:has(input:checked){border-color:var(--gold);background:#443b2b}.radio-tile input{accent-color:var(--gold)}.dashboard{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);gap:18px}.board-layout{display:grid;grid-template-columns:300px 1fr;gap:18px}.big-ball{width:min(100%,240px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto;background:radial-gradient(circle at 30% 24%,#fff7ce,#f5c85a 60%,#bf7f30 100%);color:#182039;border:8px solid #edc068;box-shadow:0 0 0 10px #eac15c19,0 20px 40px #0006}.big-ball .letter{font-size:36px;font-weight:1000}.big-ball .digit{font-size:76px;font-weight:1000;line-height:1}.number-grid{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px}.number{aspect-ratio:1;display:grid;place-items:center;border:1px solid #334764;background:#0b182c;border-radius:7px;font-size:12px;font-weight:800;color:#8e9bb2}.number.hit{background:#d5b55f;color:#162039;border-color:#fce69a}.number.recent{background:#2ad3bd;color:#0b2430;border-color:#a8fff4;box-shadow:0 0 10px #2ad3bd60}.history{display:flex;flex-wrap:wrap;gap:6px;max-height:118px;overflow-y:auto}.history .pill{background:#1c304b}.players{display:flex;flex-direction:column;gap:8px;max-height:385px;overflow:auto}.player-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:#14233a;border:1px solid #304864;border-radius:10px}.stage-list{display:flex;flex-direction:column;gap:9px}.stage-item{border:1px solid #3a506b;border-radius:13px;padding:12px;background:#0e1c30}.stage-item.active{border-color:var(--gold);background:#342c25}.stage-item.done{opacity:.74}.stage-item .name{font-weight:850}.stage-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stage-form .wide{grid-column:1/-1}.guest-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.bingo-card{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bingo-head{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}.bingo-head span{text-align:center;font-size:clamp(21px,5vw,35px);font-weight:1000;color:var(--gold)}.square{aspect-ratio:1;min-width:0;border:2px solid #39536e;border-radius:10px;background:#0b1728;color:#f3f8ff;font-size:clamp(14px,3.6vw,26px);font-weight:950;display:grid;place-items:center;position:relative}.square.called{border-color:#658da9}.square.marked{background:linear-gradient(145deg,#2dceb9,#167f85);border-color:#a2ffea;color:white;box-shadow:inset 0 0 0 2px #50e4d6}.square.marked:after{content:'✓';position:absolute;top:3px;right:5px;font-size:12px}.square.free{background:#58492d;border-color:#e5b660;color:#ffdf93}.square:disabled{cursor:default}.winner-entry{padding:11px 12px;background:#173e35;border:1px solid #40917b;border-radius:11px;margin:7px 0}.winner-entry strong{display:block;color:#b8fff1}.alert{border:1px solid #5b627b;background:#262b43;border-radius:12px;padding:14px;line-height:1.5}.alert.success{background:#193c36;border-color:#418875}.alert.warning{background:#403527;border-color:#8e703f}.qr{background:white;border-radius:12px;padding:12px;min-height:190px;min-width:190px;display:grid;place-items:center}.qr img,.qr canvas{max-width:100%;height:auto}.overlay{position:fixed;inset:0;background:#030813dc;z-index:50;display:grid;place-items:center;padding:20px}.modal{max-width:510px;width:100%;background:linear-gradient(145deg,#273551,#121b2f);border:1px solid #7895b6;border-radius:24px;padding:25px;box-shadow:0 25px 95px #0009}.modal h2{font-size:32px;margin:4px 0 12px}.toast{position:fixed;right:18px;bottom:18px;background:#274c43;border:1px solid #80d6b8;border-radius:12px;padding:13px 17px;z-index:100;max-width:370px;box-shadow:0 20px 50px #0008}.separator{border-top:1px solid var(--line);margin:16px 0}.room-code{font-size:30px;font-weight:1000;letter-spacing:.13em;color:var(--gold)}.count{font-size:32px;font-weight:1000;letter-spacing:-.05em}.error{color:#ffb4be}.soft{color:var(--muted);font-size:13px}.scroll{overflow:auto}.footer{margin-top:22px;font-size:12px;color:#9baecb}.hidden{display:none!important}@media(max-width:1100px){.dashboard,.guest-layout{grid-template-columns:1fr}.board-layout{grid-template-columns:245px 1fr}.feature-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{padding:13px 12px 45px}.topbar{margin-bottom:16px}.logo{font-size:17px}.landing-grid,.board-layout{grid-template-columns:1fr}.card.pad{padding:16px}.feature-grid{grid-template-columns:1fr 1fr}.stage-form{grid-template-columns:1fr 1fr}.big-ball{width:190px}.number-grid{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}.number{font-size:11px}.bingo-card,.bingo-head{gap:5px}.square{border-radius:7px}.room-code{font-size:24px}}@media(max-width:390px){.stage-form{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.number-grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
</style>

<body>
<main id="app" class="shell"></main><div id="modal-root"></div><div id="toast-root"></div>
<script src="firebase-config.js"></script>
<script src="qr-local.js"></script>
<script>
'use strict';
// BINGO LIVE: no npm and no application server. Demo uses localStorage; live uses Firebase.
const PATS={line:'Any Line',row:'Any Horizontal Line',col:'Any Vertical Line',diagonal:'Diagonal',corners:'Four Corners',x:'Letter X',plus:'Plus Sign',t:'Letter T',l:'Letter L',u:'Letter U',frame:'Picture Frame',diamond:'Diamond',blackout:'Blackout'};
const CELLS={corners:[0,4,20,24],x:[0,4,6,8,12,16,18,20,24],plus:[2,7,10,11,12,13,14,17,22],t:[0,1,2,3,4,7,12,17,22],l:[0,5,10,15,20,21,22,23,24],u:[0,4,5,9,10,14,15,19,20,21,22,23,24],frame:[0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24],diamond:[2,6,8,10,12,14,16,18,22],blackout:Array.from({length:25},(_,i)=>i)};
const START_STAGES=[
 {id:'stage1',name:'First Line Prize',pattern:'line',eligibility:'all',limit:1,approval:'auto',markMode:'auto'},
 {id:'stage2',name:'Letter X Prize',pattern:'x',eligibility:'all',limit:3,approval:'auto',markMode:'hybrid'},
 {id:'stage3',name:'Four Corners Prize',pattern:'corners',eligibility:'new',limit:3,approval:'auto',markMode:'auto'},
 {id:'stage4',name:'Grand Prize — Blackout',pattern:'blackout',eligibility:'all',limit:1,approval:'auto',markMode:'auto'}
];
const $=s=>document.querySelector(s);const el=id=>document.getElementById(id);
const S={mode:'demo',role:'',uid:'',roomId:'',room:null,player:null,auth:null,db:null,ref:null,pollTimer:null,watch:null,marks:new Set(),lastWinKey:'',lastReset:-1,stageDraft:null,busy:false,reconciling:false,notice:'',lastQrUrl:'',fetchErrors:0};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const randomInt=n=>{if(window.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n)};
const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=randomInt(i+1);[out[i],out[j]]=[out[j],out[i]];}return out};
const code=()=>Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randomInt(32)]).join('');
const ball=n=>n?('BINGO'[Math.floor((Number(n)-1)/15)]+'-'+n):'—';
const cardKey=a=>a.join(',');
function makeCard(){const a=Array(25).fill(0);for(let c=0;c<5;c++){const p=shuffle(Array.from({length:15},(_,i)=>i+1+15*c));for(let r=0;r<5;r++)a[r*5+c]=p[r];}a[12]=0;return a}
function isPattern(card,called,pat,marks){if(!Array.isArray(card)||card.length!==25)return false;const has=i=>i===12||((called.has(card[i]))&&(!marks||marks.has(i)));const lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c));const diag=[[0,6,12,18,24],[4,8,12,16,20]];let patterns=CELLS[pat]?[CELLS[pat]]:pat==='line'?[...lines,...diag]:pat==='row'?lines.slice(0,5):pat==='col'?lines.slice(5):pat==='diagonal'?diag:[];return patterns.some(p=>p.every(has))}
function makeRoom(id,uid){return {hostUid:uid,createdAt:Date.now(),players:{},claims:{},winners:{},candidates:{},stages:clone(START_STAGES),public:{code:id,status:'lobby',called:[],stageIndex:0,last:null,playerCount:0,resetVersion:0,updatedAt:Date.now(),winnerList:[],stage:clone(START_STAGES[0])}}}
const currentStage=r=>r?.stages?.[r.public.stageIndex]||null;
const players=r=>Object.entries(r?.players||{}).filter(([,p])=>Array.isArray(p.card)&&p.card.length===25).map(([uid,p])=>({...p,uid}));
const awardList=(r,stageId)=>Object.values(r?.winners?.[stageId]||{}).sort((a,b)=>(a.drawCount||0)-(b.drawCount||0));
const allWinners=r=>Object.values(r?.winners||{}).flatMap(x=>Object.values(x||{}));
const oldWinners=(r,stageIndex)=>r.stages.slice(0,stageIndex).some(st=>Object.keys(r.winners?.[st.id]||{}).length>0);
const isEligible=(r,p,stage)=>{const prior=r.stages.slice(0,r.public.stageIndex).some(st=>!!r.winners?.[st.id]?.[p.uid]);return stage.eligibility==='all'||(stage.eligibility==='new'&&!prior)||(stage.eligibility==='previous'&&prior)};
const trimName=s=>String(s||'').trim().replace(/\s+/g,' ').slice(0,30);
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k,d=null)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const demoKey=id=>'bingolive_demo_'+id;
function stageLabel(s){return s?`${PATS[s.pattern]||s.pattern} · ${s.eligibility==='all'?'Everyone':s.eligibility==='new'?'New winners only':'Past winners only'}`:'No stage'}
function sessionSave(){try{sessionStorage.setItem('bingolive_session',JSON.stringify({role:S.role,mode:S.mode,roomId:S.roomId,uid:S.uid}))}catch(e){}}
function toast(message,error=false){el('toast-root').innerHTML=`<div class="toast" style="${error?'background:#60303b;border-color:#ce7688':''}">${safe(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el('toast-root').innerHTML='',3700)}
function confirmDialog(title,message,yes,onYes){el('modal-root').innerHTML=`<div class="overlay"><div class="modal"><div class="eyebrow">Host confirmation</div><h2>${safe(title)}</h2><p>${safe(message)}</p><div class="row"><button class="btn" id="modal-yes">${safe(yes)}</button><button class="btn secondary" id="modal-no">Cancel</button></div></div></div>`;el('modal-yes').onclick=()=>{el('modal-root').innerHTML='';onYes()};el('modal-no').onclick=()=>el('modal-root').innerHTML=''}
function onlineConfigured(){const c=window.BINGO_FIREBASE_CONFIG||{};return !!(c.apiKey&&c.authDomain&&c.databaseURL&&c.projectId)}
function render(){if(!S.role)return renderLanding();if(S.role==='host')return renderHost();return renderGuest()}
function topBarHtml(){return `<header class="topbar"><div class="logo"><div class="logo-mark">B</div><div>BINGO <span style="color:var(--gold)">LIVE</span><div class="tiny muted" style="font-weight:600;letter-spacing:.03em">NO NPM • NO BUILD TOOLS</div></div></div><div class="row"><span class="pill ${S.mode==='demo'?'gold':'green'}">${S.mode==='demo'?'DEMO MODE':'FIREBASE LIVE'}</span>${S.role?'<button class="btn ghost mini" data-act="leave">Home</button>':''}</div></header>`}
function renderLanding(){const roomFromUrl=(new URLSearchParams(location.search)).get('room')||'';const preferred=(new URLSearchParams(location.search)).get('mode')||'demo';el('app').innerHTML=topBarHtml()+`<section><span class="eyebrow">The party starts here</span><h1 class="heading">One room. A hundred cards. <span style="color:var(--gold)">Unlimited excitement.</span></h1><p class="muted" style="max-width:680px">Live 75-ball Bingo with random cards, stage-by-stage prizes, winner eligibility, automatic checking, and continuous play. Cards never change when you reset the draws.</p></section><div class="landing-grid"><div class="card pad stack"><div class="eyebrow">01 / Host</div><h2 class="section-title">Start a Bingo room</h2><p class="soft">Build your game, invite guests, and control every draw. Demo works without Firebase.</p><div class="field"><label>Game mode</label><div class="mode-grid"><label class="radio-tile"><input type="radio" name="hostmode" value="demo" checked> Local demo</label><label class="radio-tile"><input type="radio" name="hostmode" value="firebase" ${preferred==='firebase'?'checked':''}> Firebase Live</label></div></div><button class="btn block" data-act="create">✦ Create Bingo Room</button>${!onlineConfigured()?'<div class="alert warning small">Firebase is not configured yet. To play across phones, edit <strong>firebase-config.js</strong> and add your Firebase project details.</div>':'<div class="alert success small">Firebase settings found. Set up Anonymous Authentication and deploy the Realtime Database Rules before playing live.</div>'}</div><div class="card pad stack"><div class="eyebrow">02 / Player</div><h2 class="section-title">Join with your name</h2><p class="soft">Scan the host QR code or enter your room PIN.</p><form id="join-form" class="stack"><div class="field"><label for="room-input">Room code</label><input class="input" id="room-input" name="room" required maxlength="8" autocomplete="off" value="${safe(roomFromUrl)}" placeholder="ABC123"></div><div class="field"><label for="name-input">Your display name</label><input class="input" id="name-input" name="name" required maxlength="30" placeholder="Enter your name" autocomplete="name"></div><div class="field"><label>Connect using</label><select class="select" name="mode" id="guestmode"><option value="demo" ${preferred!=='firebase'?'selected':''}>Local demo (same browser)</option><option value="firebase" ${preferred==='firebase'?'selected':''}>Firebase Live (multiple phones)</option></select></div><button class="btn secondary block" type="submit">Join Game →</button></form></div></div><div class="feature-grid"><div class="feature"><strong>🎲 Fair Cards</strong><span class="soft">Unique randomized 5×5 cards; FREE center.</span></div><div class="feature"><strong>🏆 Prize Stages</strong><span class="soft">Configure pattern, repeat eligibility, and winner limits.</span></div><div class="feature"><strong>↪ Continuous Play</strong><span class="soft">Keep draws and cards when changing prize patterns.</span></div><div class="feature"><strong>📱 Responsive</strong><span class="soft">Built for mobile guests and projector hosts.</span></div></div><div class="footer">BINGO LIVE • For free community and school entertainment, without betting or payments.</div>`}
function joinLink(){if(location.protocol==='file:')return location.href.split('?')[0]+'?room='+encodeURIComponent(S.roomId)+'&mode='+S.mode;return location.origin+location.pathname+'?room='+encodeURIComponent(S.roomId)+'&mode='+S.mode}
function numBoard(pub){const called=new Set(pub.called||[]);return `<div class="number-grid">${Array.from({length:75},(_,i)=>i+1).map(n=>`<div class="number ${called.has(n)?'hit':''} ${pub.last===n?'recent':''}" title="${ball(n)}">${n}</div>`).join('')}</div>`}
function recentHistory(pub){return `<div class="history">${(pub.called||[]).length?pub.called.slice().reverse().map((n,i)=>`<span class="pill ${i===0?'green':''}">${ball(n)}</span>`).join(''):'<span class="soft">No numbers drawn yet.</span>'}</div>`}
function winnerHTML(r){const st=currentStage(r);const winners=awardList(r,st?.id);return winners.length?winners.map((w,i)=>`<div class="winner-entry"><strong>🏆 ${safe(w.name)}</strong><span class="tiny">${safe(st.name)} · Draw #${w.drawCount||0}</span></div>`).join(''):'<div class="soft">No confirmed winners for this stage yet.</div>'}
function stageEntries(r){return r.stages.map((st,i)=>`<div class="stage-item ${r.public.stageIndex===i?'active':r.public.stageIndex>i?'done':''}"><div class="row between"><div class="name">${i+1}. ${safe(st.name)}</div>${r.public.stageIndex===i?'<span class="pill gold">CURRENT</span>':r.public.stageIndex>i?'<span class="pill green">DONE</span>':''}</div><div class="soft">${safe(stageLabel(st))}</div><div class="row" style="margin-top:8px"><span class="pill">${st.limit===0?'Unlimited':st.limit+' max + ties'}</span><span class="pill">${safe(st.markMode)}</span><span class="pill">${safe(st.approval)}</span></div>${r.public.status==='lobby'&&i===r.public.stageIndex||i>r.public.stageIndex?`<div class="row" style="margin-top:9px"><button class="btn ghost mini" data-act="editstage" data-index="${i}">Edit</button>${i>r.public.stageIndex?`<button class="btn secondary mini" data-act="selectstage" data-index="${i}">Select</button>`:''}</div>`:''}</div>`).join('')}
function qrPanel(){const url=joinLink();const hint=location.protocol==='file:'?`This is a local file link; other phones cannot access your computer file. Publish this folder to HTTPS for real phone QR joining.`:S.mode==='demo'?'Demo mode works only on the same browser storage. Select Firebase Live for other phones.':'Share this URL with your players.';return `<div class="card pad stack"><div class="row between"><div><div class="eyebrow">Room PIN</div><div class="room-code">${safe(S.roomId)}</div></div><span class="pill ${S.room?.public.status==='playing'?'green':'gold'}">${safe(S.room?.public.status||'lobby').toUpperCase()}</span></div><div class="row" style="align-items:flex-start"><div class="qr" id="qr-container"><span style="color:#162137">QR loading</span></div><div class="grow" style="min-width:140px"><div class="soft">${safe(hint)}</div><div style="overflow-wrap:anywhere;font-size:11px;margin:10px 0;color:#99afcb">${safe(url)}</div><button class="btn mini secondary" data-act="copylink">Copy Join Link</button></div></div></div>`}
function drawPanel(r){const pub=r.public;return `<div class="card pad stack"><div class="row between"><div><div class="eyebrow">Live number draw</div><h2 class="section-title">${safe(currentStage(r)?.name||'Bingo')}</h2></div><span class="pill">${(pub.called||[]).length} / 75 DRAWN</span></div><div class="board-layout"><div class="stack" style="justify-content:center;text-align:center"><div class="big-ball"><div class="letter">${pub.last?'BINGO'[Math.floor((pub.last-1)/15)]:'✦'}</div><div class="digit">${pub.last||'—'}</div></div><div class="row" style="justify-content:center"><button class="btn" data-act="draw" ${pub.status!=='playing'||(pub.called||[]).length>=75?'disabled':''}>🎲 Draw Next</button><button class="btn secondary" data-act="togglepause" ${!['playing','paused'].includes(pub.status)?'disabled':''}>${pub.status==='paused'?'▶ Resume':'⏸ Pause'}</button></div></div><div class="stack"><div class="eyebrow">Called number board</div>${numBoard(pub)}<div class="eyebrow">Latest first • complete draw history</div>${recentHistory(pub)}</div></div></div>`}

function syncMarks(){if(S.role!=='player'||!S.room?.public||!S.player?.card)return;const pub=S.room.public,key=`bingolive_marks_${S.roomId}_${S.uid}`;const saved=load(key,{});if(S.lastReset!==pub.resetVersion){S.lastReset=pub.resetVersion;S.marks=new Set(saved.version===pub.resetVersion?(saved.marks||[]):[])}if(pub.stage?.markMode==='auto'){const called=new Set(pub.called||[]);S.player.card.forEach((n,i)=>{if(called.has(n)&&n)S.marks.add(i)})}store(key,{version:pub.resetVersion,marks:[...S.marks]});const w=(pub.winnerList||[]).find(x=>x.uid===S.uid),tag=w?`${pub.stageIndex}_${w.drawCount}_${pub.resetVersion}`:'';if(w&&tag!==S.lastWinKey){S.lastWinKey=tag;setTimeout(()=>{if(S.role==='player'){el('modal-root').innerHTML=`<div class="overlay"><div class="modal" style="text-align:center"><div style="font-size:60px">🏆🎉</div><div class="eyebrow">Verified Bingo Winner</div><h2>${safe(w.name)}</h2><p>You won <strong>${safe(pub.stage?.name)}</strong> at draw #${w.drawCount}!</p><button class="btn block" data-act="closemodal">Continue Playing →</button></div></div>`}},200)}else if(!w)S.lastWinKey=''}

function deepSet(obj,path,value){const parts=path.split('/');let p=obj;for(let i=0;i<parts.length-1;i++){p[parts[i]]??={};p=p[parts[i]]}if(value===null)delete p[parts.at(-1)];else p[parts.at(-1)]=clone(value)}

      await loadScript(base+'firebase-database-compat.js');

async function submitClaim(){const r=S.room,st=r.public.stage;if(!S.player?.card||st?.markMode!=='manual'||r.public.status!=='playing')return toast('Manual BINGO is not enabled right now.',true);const called=new Set(r.public.called||[]);if(!isPattern(S.player.card,called,st.pattern,S.marks))return toast('Not BINGO yet. Check your called and marked numbers!',true);const claim={stageId:st.id,drawCount:r.public.called.length,marks:[...S.marks],at:Date.now()};try{if(S.mode==='demo')patchDemo({['claims/'+S.uid]:claim});else await rest('rooms/'+S.roomId+'/claims/'+S.uid,'PUT',claim);toast('BINGO claim submitted! Waiting for host verification.')}catch(e){toast('Could not submit claim: '+e.message,true)}}
function findNewAwards(r){
 const st=currentStage(r),drawn=r.public.called||[];
 if(!st||r.public.status!=='playing')return {awards:[],rejections:[],cleared:[]};
 const have=awardList(r,st.id),reached=st.limit>0&&have.length>=st.limit;
 if(reached&&st.markMode!=='manual')return {awards:[],rejections:[],cleared:[]};
 // A delayed manual claim may still tie with the cutoff draw, rather than
 // being denied only because another guest's internet request arrived first.
 const cutoff=reached?have[Math.min(st.limit,have.length)-1].drawCount:Infinity;
 const awards=[],rejections=[],cleared=[];
 for(const p of players(r)){
  if(!isEligible(r,p,st)||r.winners?.[st.id]?.[p.uid]||r.candidates?.[p.uid])continue;
  const claim=r.claims?.[p.uid];
  if(st.markMode==='manual'&&(!claim||claim.stageId!==st.id))continue;
  const drawCount=st.markMode==='manual'?Math.max(0,Math.min(drawn.length,Number(claim.drawCount??drawn.length))):drawn.length;
  if(claim&&claim.stageId===st.id)cleared.push(p.uid);
  if(drawCount>cutoff)continue;
  const marks=st.markMode==='manual'?new Set(claim.marks||[]):null;
  const won=isPattern(p.card,new Set(drawn.slice(0,drawCount)),st.pattern,marks);
  if(won)awards.push({uid:p.uid,name:p.name,stageId:st.id,drawCount,at:Date.now()});
  else if(claim&&claim.stageId===st.id)rejections.push(p.uid);
 }
 return {awards,rejections,cleared};
}
async function reconcileHost(){if(S.reconciling||S.role!=='host'||!S.room)return;S.reconciling=true;try{const r=S.room;const pending=Object.entries(r.players||{}).filter(([,p])=>!p.card&&!p.rejected);if(pending.length){const unique=new Set(players(r).map(p=>cardKey(p.card))),changes={};let count=players(r).length;for(const [uid] of pending){if(count>=100){changes['players/'+uid+'/rejected']=true;continue}let card,tries=0;do{card=makeCard();tries++}while(unique.has(cardKey(card))&&tries<50);unique.add(cardKey(card));changes['players/'+uid+'/card']=card;count++}changes['public/playerCount']=count;changes['public/updatedAt']=Date.now();await patchHost(changes);return}const {awards,rejections,cleared}=findNewAwards(r);if(!awards.length&&!cleared.length)return;const st=currentStage(r),changes={};for(const uid of cleared){changes['claims/'+uid]=null;if(rejections.includes(uid))changes['players/'+uid+'/claimFeedback']='Invalid BINGO. Mark only officially called numbers.'}if(awards.length){if(st.approval==='auto'){for(const w of awards)changes[`winners/${st.id}/${w.uid}`]=w;changes['public/winnerList']=[...awardList(r,st.id),...awards].sort((a,b)=>a.drawCount-b.drawCount)}else{for(const w of awards)changes['candidates/'+w.uid]=w}}if(Object.keys(changes).length)await patchHost(changes)}catch(e){toast('Host sync issue: '+(e.message||e),true)}finally{S.reconciling=false}}
function modifiedPub(r,newFields){return {...r.public,...newFields,updatedAt:Date.now()}}
async function hostAction(act,extra){const r=S.room;if(!r)return;let changes={},pub=r.public,st=currentStage(r);switch(act){

case 'draw':if(pub.status!=='playing')return;const remaining=Array.from({length:75},(_,i)=>i+1).filter(n=>!(pub.called||[]).includes(n));if(!remaining.length)return toast('All 75 numbers have been drawn.');const n=remaining[randomInt(remaining.length)];changes.public=modifiedPub(r,{called:[...(pub.called||[]),n],last:n});break;
case 'togglepause':changes.public=modifiedPub(r,{status:pub.status==='playing'?'paused':pub.status==='paused'?'playing':pub.status});break;
case 'nextstage':if(pub.stageIndex>=r.stages.length-1)return toast('Already at the last stage. Add another stage if needed.');changes.public=modifiedPub(r,{stageIndex:pub.stageIndex+1,stage:r.stages[pub.stageIndex+1],winnerList:[]});break;
case 'selectstage':{const index=Number(extra);if(index<=pub.stageIndex||index>=r.stages.length)return;changes.public=modifiedPub(r,{stageIndex:index,stage:r.stages[index],winnerList:[]});break}
case 'end':changes.public=modifiedPub(r,{status:'ended'});break;
case 'reopen':changes.public=modifiedPub(r,{status:'paused'});break;
case 'resetdraws':changes={winners:null,candidates:null,claims:null,public:modifiedPub(r,{called:[],last:null,stageIndex:0,stage:r.stages[0],winnerList:[],status:'lobby',resetVersion:(pub.resetVersion||0)+1})};break;
case 'approve':{const proposed=Object.values(r.candidates||{}).filter(c=>c.stageId===st?.id).sort((a,b)=>a.drawCount-b.drawCount);if(!proposed.length)return toast('No pending candidates.');const existing=awardList(r,st.id);if(st.limit>0&&existing.length>=st.limit)return toast('Winner limit already reached.');const firstDraw=proposed[0].drawCount;let winners=proposed.filter(w=>w.drawCount===firstDraw);if(st.limit===0){winners=proposed}for(const w of winners){changes[`winners/${st.id}/${w.uid}`]=w;changes['candidates/'+w.uid]=null}changes['public/winnerList']=[...existing,...winners];break}
case 'adddemo':{if(S.mode!=='demo')return;const names=['Alex','Bea','Carlo','Dani','Ella','Francis','Gina','Hugo','Ivy','Jules','Kai','Luna'];let idx=0;for(const name of names){const uid='sim_'+code()+'_'+idx;changes['players/'+uid]={name:`${name} (Demo)`,uid,joinedAt:Date.now()+idx++}}break}
}try{if(Object.keys(changes).length)await patchHost(changes);if(act==='nextstage'||act==='selectstage')toast('Prize stage changed. Called numbers and cards retained.');if(act==='draw')toast('Drawn: '+ball(changes.public.last))}catch(e){toast('Action failed: '+e.message,true)}}
async function saveStage(form){const f=new FormData(form);const name=trimName(f.get('name'));if(!name)return toast('Enter a prize stage name.',true);const r=S.room,d=S.stageDraft||{};const st={id:d.id||('stage'+Date.now()+'_'+code()),name,pattern:String(f.get('pattern')),eligibility:String(f.get('eligibility')),limit:Number(f.get('limit')),markMode:String(f.get('markMode')),approval:String(f.get('approval'))};if(!PATS[st.pattern])return toast('Invalid pattern.',true);const stages=clone(r.stages),editIndex=d.editIndex;if(Number.isInteger(editIndex)){if(editIndex<r.public.stageIndex||editIndex===r.public.stageIndex&&r.public.status!=='lobby')return toast('Active/finished stages are locked.',true);stages[editIndex]=st}else stages.push(st);const changes={stages};if(Number.isInteger(editIndex)&&editIndex===r.public.stageIndex)changes.public=modifiedPub(r,{stage:st});try{await patchHost(changes);S.stageDraft=null;render();toast('Prize stage saved!')}catch(e){toast('Could not save: '+e.message,true)}}
async function leave(){clearInterval(S.pollTimer);S.pollTimer=null;if(S.ref){S.ref.off();S.ref=null}window.removeEventListener('storage',onDemoStorage);S.role='';S.room=null;S.roomId='';S.stageDraft=null;S.player=null;S.marks=new Set();try{sessionStorage.removeItem('bingolive_session')}catch(e){}if(location.search){history.replaceState(null,'',location.pathname)}render()}
async function runAct(act,btn){if(act==='closemodal'){el('modal-root').innerHTML='';return}if(act==='leave')return leave();if(act==='create')return createRoom(document.querySelector('input[name="hostmode"]:checked')?.value||'demo');if(act==='copylink'){try{await navigator.clipboard.writeText(joinLink());toast('Join link copied!')}catch(e){prompt('Copy this link:',joinLink())}return}if(S.role==='player'){if(act==='mark'){const idx=Number(btn.dataset.index),n=S.player?.card?.[idx];if(!n||!S.room?.public.called?.includes(n))return;if(S.marks.has(idx))S.marks.delete(idx);else S.marks.add(idx);store(`bingolive_marks_${S.roomId}_${S.uid}`,{version:S.room.public.resetVersion,marks:[...S.marks]});render();return}if(act==='claim')return submitClaim();return}
if(S.role!=='host')return;
if(act==='addstage'){S.stageDraft={name:'New Prize Stage',pattern:'blackout',eligibility:'all',limit:1,markMode:'auto',approval:'auto'};render();return}
if(act==='editstage'){const i=Number(btn.dataset.index);S.stageDraft={...S.room.stages[i],editIndex:i};render();return}
if(act==='cancelstage'){S.stageDraft=null;render();return}
if(act==='resetdraws')return confirmDialog('Reset Draws?','This clears the drawn-number history and prize awards, but KEEP every guest’s original card numbers.','Reset Draws',()=>hostAction('resetdraws'));
if(act==='end')return confirmDialog('End Event?','The event will stop. Player cards, drawn numbers and winner history will remain saved.','End Event',()=>hostAction('end'));
if(act==='selectstage'){const n=Number(btn.dataset.index);return confirmDialog('Switch prize stage?','Current card assignments, marked numbers, and all drawn balls will remain intact.','Continue',()=>hostAction('selectstage',n))}
if(act==='nextstage')return confirmDialog('Continue to next prize?','Use existing drawn numbers and the same cards. All eligible cards will be checked against the next pattern.','Continue',()=>hostAction('nextstage'));
return hostAction(act)
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();runAct(b.dataset.act,b).catch(err=>toast(err.message,true))}});
document.addEventListener('submit',e=>{if(e.target.id==='join-form'){e.preventDefault();const f=new FormData(e.target);const name=trimName(f.get('name')),id=String(f.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!id||!name)return toast('Enter your room code and name.',true);joinRoom(id,name,String(f.get('mode')))}if(e.target.id==='stage-form'){e.preventDefault();saveStage(e.target)}});
(async function boot(){const params=new URLSearchParams(location.search);const session=(()=>{try{return JSON.parse(sessionStorage.getItem('bingolive_session'))}catch(e){return null}})();if(session?.role==='host'&&session?.roomId){S.mode=session.mode;S.role='host';S.roomId=session.roomId;try{if(S.mode==='demo'){S.uid=demoRead(S.roomId)?.hostUid;watchDemo()}else{await authorize();S.db=firebase.database();watchHost()}return}catch(e){toast('Could not restore host session: '+e.message,true);S.role=''}}if(session?.role==='player'&&session?.roomId){S.mode=session.mode;S.role='player';S.roomId=session.roomId;try{if(S.mode==='demo'){const room=demoRead(S.roomId);if(!room)throw Error('Demo room missing');S.uid=session.uid;if(!S.uid)throw Error('Missing guest identity');S.player=room.players[S.uid];watchDemo()}else{await authorize();S.player=await rest('rooms/'+S.roomId+'/players/'+S.uid);startPolling()}return}catch(e){S.role=''}}render();if(params.has('room'))setTimeout(()=>el('name-input')?.focus(),150)})();
</script>
