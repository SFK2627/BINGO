/* V14.2 — Unified accessibility colors for every host-synced guest theme.
   Semantic messages must never inherit dark-mode backgrounds under light text, or vice versa.
   The printed Bingo card is deliberately excluded so each guest's chosen card style stays intact. */
body[data-palette]{
 --msg-good-bg:#17473b;--msg-good-fg:#ebfff7;--msg-good-border:#74cfad;
 --msg-warn-bg:#49351f;--msg-warn-fg:#fff3d9;--msg-warn-border:#e9ae5b;
 --msg-error-bg:#572937;--msg-error-fg:#ffeef2;--msg-error-border:#ee8298;
 --msg-neutral-bg:var(--v8-surface);--msg-neutral-fg:var(--v8-ink);
}
body[data-appearance="light"]{
 --msg-good-bg:#e1f6eb;--msg-good-fg:#124d38;--msg-good-border:#448765;
 --msg-warn-bg:#fff0d2;--msg-warn-fg:#68440b;--msg-warn-border:#bb852b;
 --msg-error-bg:#ffeaec;--msg-error-fg:#7b2339;--msg-error-border:#b95269;
 --msg-neutral-bg:var(--v8-surface);--msg-neutral-fg:var(--v8-ink);
}
/* Announcements, including the guest's 'You won this prize' message. */
body[data-palette] .alert,
body[data-palette] .alert:not(.success):not(.warning){background:var(--msg-neutral-bg)!important;color:var(--msg-neutral-fg)!important;border:1px solid var(--v8-stroke)!important}
body[data-palette] .alert.success,
body[data-palette] #guest-win-message .alert.success{
 background:var(--msg-good-bg)!important;color:var(--msg-good-fg)!important;border:2px solid var(--msg-good-border)!important;
 box-shadow:0 5px 16px #0000000b;
}
body[data-palette] .alert.warning{background:var(--msg-warn-bg)!important;color:var(--msg-warn-fg)!important;border:1px solid var(--msg-warn-border)!important}
body[data-palette] .alert.error{background:var(--msg-error-bg)!important;color:var(--msg-error-fg)!important;border:1px solid var(--msg-error-border)!important}
body[data-palette] #guest-win-message .alert{font-size:clamp(12px,2.9vw,15px);line-height:1.5;font-weight:750;padding:11px 13px;margin:9px 0 3px;border-radius:13px}
body[data-palette] #guest-win-message .alert strong,
body[data-palette] #guest-win-message .alert span{color:inherit!important}
/* Status badges are light too in Light Mode; no dark red/green pills with inherited dark lettering. */
body[data-appearance="light"] .pill.green{background:var(--msg-good-bg)!important;color:var(--msg-good-fg)!important;border-color:var(--msg-good-border)!important}
body[data-appearance="light"] .pill.red{background:var(--msg-error-bg)!important;color:var(--msg-error-fg)!important;border-color:var(--msg-error-border)!important}
body[data-appearance="light"] .pill.gold{background:var(--msg-warn-bg)!important;color:var(--msg-warn-fg)!important;border-color:var(--msg-warn-border)!important}
/* Previous winners, called history and mobile room status. */
body[data-palette] .winner-entry{
 background:var(--msg-good-bg)!important;color:var(--msg-good-fg)!important;
 border:1px solid var(--msg-good-border)!important;

/* V20 — Always-alive orbit rings: idle, mixing and reveal. Pure decoration. */
.host-draw-panel .ball-orbit{
  --orbit-accent:var(--v8-accent,#f8ca79);
  --orbit-outline:color-mix(in srgb,var(--orbit-accent) 68%,transparent);
}
/* Three independently rotating tracks. Only the outlines rotate, never the ball or number. */
body[data-palette] .host-draw-panel .ball-orbit::before,
.host-draw-panel .ball-orbit::before{
  content:"";
  position:absolute;
  inset:-5px;
  z-index:0;
  border:3px dashed var(--orbit-outline);
  border-radius:50%;
  pointer-events:none;
  opacity:.85;
  animation:orbit-v20-cw 27s linear infinite!important;
  will-change:transform;
}
body[data-palette] .host-draw-panel .ball-orbit::after,
.host-draw-panel .ball-orbit::after{
  content:"";
  position:absolute;
  inset:-16px;
  z-index:0;
  border:3px solid transparent;
  border-top-color:var(--orbit-accent);
  border-right-color:var(--orbit-outline);
  border-bottom-color:color-mix(in srgb,var(--orbit-accent) 34%,transparent);
  border-radius:50%;
  opacity:.75;
  pointer-events:none;
  animation:orbit-v20-ccw 34s linear infinite!important;
  will-change:transform;
}
.host-draw-panel .ball-orbit>.orbit-tracer{
  position:absolute;
  inset:4%;
  z-index:0;
  border:2px dotted var(--orbit-accent);
  border-radius:50%;
  opacity:.72;
  pointer-events:none;
  animation:orbit-v20-cw 41s linear infinite;
  will-change:transform;
}
.host-draw-panel .ball-orbit>.big-ball{z-index:1}
/* Short suspense: rings speed up while the drawing machine is visible. */
body[data-palette] .host-draw-panel .ball-orbit.draw-machine-active::before,
.host-draw-panel .ball-orbit.draw-machine-active::before{
  animation-duration:1.2s!important;
  opacity:1;
  border-color:var(--orbit-accent);
  filter:drop-shadow(0 0 6px var(--orbit-accent));
}
body[data-palette] .host-draw-panel .ball-orbit.draw-machine-active::after,
.host-draw-panel .ball-orbit.draw-machine-active::after{
  animation-duration:1.7s!important;
  opacity:1;
  filter:drop-shadow(0 0 10px var(--orbit-accent));
}
.host-draw-panel .ball-orbit.draw-machine-active>.orbit-tracer{
  animation-duration:2.15s;
  opacity:1;
  filter:drop-shadow(0 0 6px var(--orbit-accent));
}
/* Brief radiance at the official number reveal, then back to idle. */
.host-draw-panel .ball-orbit.orbit-reveal{
  animation:orbit-v20-reveal-flash .95s ease-out both;
}
@keyframes orbit-v20-cw {to{transform:rotate(360deg)}}
@keyframes orbit-v20-ccw {to{transform:rotate(-360deg)}}
@keyframes orbit-v20-reveal-flash{
  0%{filter:drop-shadow(0 0 1px transparent)}
  35%{filter:drop-shadow(0 0 17px var(--orbit-accent))}
  100%{filter:drop-shadow(0 0 0 transparent)}
}
body[data-appearance="light"] .host-draw-panel .ball-orbit{--orbit-outline:color-mix(in srgb,var(--orbit-accent) 80%,transparent)}
@media(prefers-reduced-motion:reduce){
  body[data-palette] .host-draw-panel .ball-orbit::before,
  body[data-palette] .host-draw-panel .ball-orbit::after,
  .host-draw-panel .ball-orbit::before,
  .host-draw-panel .ball-orbit::after,
  .host-draw-panel .ball-orbit>.orbit-tracer,
  .host-draw-panel .ball-orbit.orbit-reveal{animation:none!important;filter:none!important;will-change:auto}
}

<body>
<main id="app" class="shell"></main><div id="modal-root"></div><div id="winner-root"></div><div id="toast-root"></div>

<script>
'use strict';
// BINGO LIVE — browser-based event game.
const PATS={line:'Any Line',row:'Any Horizontal Line',col:'Any Vertical Line',diagonal:'Diagonal',corners:'Four Corners',x:'Letter X',plus:'Plus Sign',t:'Letter T',l:'Letter L',u:'Letter U',frame:'Picture Frame',diamond:'Diamond',blackout:'Blackout'};
const CELLS={corners:[0,4,20,24],x:[0,4,6,8,12,16,18,20,24],plus:[2,7,10,11,12,13,14,17,22],t:[0,1,2,3,4,7,12,17,22],l:[0,5,10,15,20,21,22,23,24],u:[0,4,5,9,10,14,15,19,20,21,22,23,24],frame:[0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24],diamond:[2,6,8,10,12,14,16,18,22],blackout:Array.from({length:25},(_,i)=>i)};
// Last Player Standing uses the same random cards and shared draws as Bingo.
// Called = Sit: a matching number eliminates you. Missed = Sit: no match eliminates you.
const LMS_RULES={hit:'Called number = Sit Down',miss:'Not called = Sit Down'};
const LMS_SOURCES={card:'Any number on my card',number:'My single lucky number'};
const isStandingStage=stage=>stage?.gameType==='laststanding';
const START_STAGES=[
 {id:'stage1',name:'First Line Prize',pattern:'line',eligibility:'all',limit:1,approval:'auto',markMode:'auto',prizeAmount:0,prizeDistribution:'each'},
 {id:'stage2',name:'Letter X Prize',pattern:'x',eligibility:'all',limit:3,approval:'auto',markMode:'hybrid',prizeAmount:0,prizeDistribution:'each'},
 {id:'stage3',name:'Four Corners Prize',pattern:'corners',eligibility:'new',limit:3,approval:'auto',markMode:'auto',prizeAmount:0,prizeDistribution:'each'},
 {id:'stage4',name:'Grand Prize — Blackout',pattern:'blackout',eligibility:'all',limit:1,approval:'auto',markMode:'auto',prizeAmount:0,prizeDistribution:'each'}
];
const $=s=>document.querySelector(s);const el=id=>document.getElementById(id);
const S={mode:'demo',role:'',uid:'',roomId:'',room:null,player:null,auth:null,db:null,ref:null,pollTimer:null,watch:null,marks:new Set(),markSyncTimer:null,markSyncWarning:false,mixAudio:null,lastWinKey:'',lastReset:-1,winnerToastTimer:null,actionBusy:false,stageDraft:null,busy:false,reconciling:false,notice:'',lastQrUrl:'',fetchErrors:0,publicRef:null,publicEtag:null,syncType:'',hostSignature:'',guestSignature:'',prevBall:null,focusMode:'',soundOn:false,voiceOn:false,voicePreset:'host',voiceURI:'auto',audioContext:null,musicOn:true,musicStyle:'game',musicMood:'chill',musicVolume:30,musicUnlocked:false,musicBus:null,musicTimer:null,musicTrack:null,musicCustomUrl:'',musicCustomBroken:false,musicQuietUntil:0,musicBeatIndex:0,musicNextBeat:0,musicResyncTimer:null,musicPreviewUntil:0,boardView:'classic',cardStyle:'classic',cardAccent:'#7055C7',hostPreviewNumber:0,assistantProfile:null,assistantJoin:null,assistantRefs:[],assistantTab:'control',assistantName:'',assistantResults:{},assistantBusy:false,assistantCommandBusy:false,assistantEditorUID:null,assistantInviteUrl:'',hostPulseTimer:null,hostPresence:null};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const friendlyError=e=>{const msg=String(e?.message||e);return /firebase|database|sdk|permission.denied|auth\/|http 40|http 50/i.test(msg)?'Unable to connect. Ask the host to check the game setup.':msg};
const randomInt=n=>{if(window.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n)};
const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=randomInt(i+1);[out[i],out[j]]=[out[j],out[i]];}return out};
const code=()=>Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[randomInt(32)]).join('');
const ball=n=>n?('BINGO'[Math.floor((Number(n)-1)/15)]+'-'+n):'—';
const cardKey=a=>a.join(',');
function makeCard(){const a=Array(25).fill(0);for(let c=0;c<5;c++){const p=shuffle(Array.from({length:15},(_,i)=>i+1+15*c));for(let r=0;r<5;r++)a[r*5+c]=p[r];}a[12]=0;return a}
function isPattern(card,called,pat,marks){if(!Array.isArray(card)||card.length!==25)return false;const has=i=>i===12||((called.has(card[i]))&&(!marks||marks.has(i)));const lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c));const diag=[[0,6,12,18,24],[4,8,12,16,20]];let patterns=CELLS[pat]?[CELLS[pat]]:pat==='line'?[...lines,...diag]:pat==='row'?lines.slice(0,5):pat==='col'?lines.slice(5):pat==='diagonal'?diag:[];return patterns.some(p=>p.every(has))}
function makeRoom(id,uid){return {assistantJoin:{},assistants:{},assistantCommands:{},assistantResults:{},hostPresence:{online:true,at:Date.now()},hostUid:uid,createdAt:Date.now(),players:{},marks:{},claims:{},winners:{},candidates:{},stages:clone(START_STAGES),public:{code:id,status:'lobby',audio:{musicOn:S.musicOn,soundOn:S.soundOn,voiceOn:S.voiceOn,musicStyle:S.musicStyle,musicMood:S.musicMood,musicVolume:S.musicVolume,voicePreset:S.voicePreset},called:[],stageIndex:0,last:null,playerCount:0,resetVersion:0,lastDrawAt:0,drawing:null,theme:{palette:HOST_PALETTES[S.palette]?S.palette:'royal',appearance:S.appearance==='light'?'light':'dark'},updatedAt:Date.now(),winnerList:[],stageStartDrawCount:0,stage:clone(START_STAGES[0])}}}
const currentStage=r=>r?.stages?.[r.public.stageIndex]||null;

// Stage awards are shown as peso amounts throughout the game.
const prizeLine=st=>{
 const value=Number(st?.prizeAmount);
 return Number.isFinite(value)&&value>0?'₱'+value.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
};
const prizeBadge=st=>{
 const amount=prizeLine(st);
 if(!amount)return '';
 const perWinner=st?.prizeDistribution!=='pool';
 return `<span class="prize-amount" aria-label="${perWinner?'Amount per winner':'Total prize pool'}: ${safe(amount)}"><strong>${safe(amount)}</strong><small>${perWinner?'per winner':'total prize pool'}</small></span>`;
};
const players=r=>Object.entries(r?.players||{}).filter(([,p])=>Array.isArray(p.card)&&p.card.length===25).map(([uid,p])=>({...p,uid}));
const joinedPlayerEntries=r=>Object.entries(r?.players||{}).filter(([,p])=>p&&!p.rejected).sort((a,b)=>(Number(a[1]?.joinedAt)||0)-(Number(b[1]?.joinedAt)||0));
const joinedPlayerCount=r=>joinedPlayerEntries(r).length;
const roundVersion=pub=>Number(pub?.resetVersion)||0;
const validRoundAward=(w,pub)=>!!w&&(w.resetVersion===undefined||w.resetVersion===null||Number(w.resetVersion)===roundVersion(pub));
const validRoundClaim=(claim,pub)=>!!claim&&Number(claim.resetVersion??0)===roundVersion(pub);
const awardList=(r,stageId)=>Object.values(r?.winners?.[stageId]||{}).filter(w=>validRoundAward(w,r?.public)).sort((a,b)=>(a.drawCount||0)-(b.drawCount||0));
const allWinners=r=>Object.values(r?.winners||{}).flatMap(x=>Object.values(x||{})).filter(w=>validRoundAward(w,r?.public));
const oldWinners=(r,stageIndex)=>r.stages.slice(0,stageIndex).some(st=>Object.keys(r.winners?.[st.id]||{}).length>0);
const isEligible=(r,p,stage)=>{const prior=r.stages.slice(0,r.public.stageIndex).some(st=>awardList(r,st.id).some(w=>w.uid===p.uid));return stage.eligibility==='all'||(stage.eligibility==='new'&&!prior)||(stage.eligibility==='previous'&&prior)};
const trimName=s=>String(s||'').trim().replace(/\s+/g,' ').slice(0,30);
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k,d=null)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
S.palette=load('bingolive_palette','royal');S.appearance=load('bingolive_appearance','dark');S.cardStyle=load('bingolive_card_style','classic');S.cardAccent=load('bingolive_card_accent','#7055C7');
const demoKey=id=>'bingolive_demo_'+id;
function stageLabel(s){return s?`${isStandingStage(s)?'Last Player Standing · '+(LMS_RULES[s.lmsRule]||LMS_RULES.hit):PATS[s.pattern]||s.pattern} · ${s.eligibility==='all'?'Everyone':s.eligibility==='new'?'New winners only':'Past winners only'}`:'No stage'}
// Only calls made after this stage started affect elimination. Older Bingo draws stay visible.
function standingSurvivors(room,drawCount){
 const pub=room?.public||{},st=pub.stage||currentStage(room);
 if(!isStandingStage(st))return [];
 const start=Math.max(0,Number(pub.stageStartDrawCount)||0);
 const draws=(pub.called||[]).slice(start,drawCount===undefined?undefined:Math.max(start,drawCount));
 return players(room).filter(p=>{
  if(!isEligible(room,p,st))return false;
  const lucky=Number(p.luckyNumber)||Number(p.card?.[p.slot%25===12?0:p.slot%25])||0;
  return draws.every(n=>{
   const matches=st.lmsSource==='number'?lucky===n:p.card.includes(n);
   return st.lmsRule==='miss'?matches:!matches;
  });
 });
}
function standingStageCalls(pub){return Math.max(0,(pub.called||[]).length-(Number(pub.stageStartDrawCount)||0))}
function standingGuestState(pub,p){
 const st=pub.stage;
 if(!isStandingStage(st)||!p?.card)return '';
 const draws=(pub.called||[]).slice(Math.max(0,Number(pub.stageStartDrawCount)||0));
 if(!draws.length)return 'Ready to stand';
 const lucky=Number(p.luckyNumber)||Number(p.card?.[p.slot%25===12?0:p.slot%25])||0;
 const sitting=draws.some(n=>{const match=st.lmsSource==='number'?lucky===n:p.card.includes(n);return st.lmsRule==='miss'?!match:match});
 return sitting?'SIT DOWN · Eliminated':'STILL STANDING';
}
function standingGuestHTML(pub,p){
 if(!isStandingStage(pub.stage))return '';
 const status=standingGuestState(pub,p),sitting=status.includes('SIT DOWN');
 return `<div class="standing-guest-status ${sitting?'eliminated':'active'}" id="standing-guest-status"><strong>${safe(status)}</strong><span>${pub.stage.lmsSource==='number'?'Your lucky number: '+ball(Number(p?.luckyNumber)||0):'Your whole card counts'} · ${pub.stage.lmsRule==='miss'?'No match? Sit down.':'Match? Sit down.'}</span></div>`;
}
function sessionSave(){try{sessionStorage.setItem('bingolive_session',JSON.stringify({role:S.role,mode:S.mode,roomId:S.roomId,uid:S.uid}))}catch(e){}}
function toast(message,error=false){el('toast-root').innerHTML=`<div class="toast ${error?'error':''}">${safe(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el('toast-root').innerHTML='',3700)}
function confirmDialog(title,message,yes,onYes){el('modal-root').innerHTML=`<div class="overlay"><div class="modal"><div class="eyebrow">Host confirmation</div><h2>${safe(title)}</h2><p>${safe(message)}</p><div class="row"><button class="btn" id="modal-yes">${safe(yes)}</button><button class="btn secondary" id="modal-no">Cancel</button></div></div></div>`;el('modal-yes').onclick=()=>{el('modal-root').innerHTML='';onYes()};el('modal-no').onclick=()=>el('modal-root').innerHTML=''}
function onlineConfigured(){const c=window.BINGO_FIREBASE_CONFIG||{};return !!(c.apiKey&&c.authDomain&&c.databaseURL&&c.projectId)}
function render(){applyTheme();document.body.classList.toggle('on-landing',!S.role);if(!S.role)return renderLanding();if(S.role==='host')return renderHost();if(S.role==='assistant')return renderAssistant();return renderGuest()}
function topBarHtml(){return `<header class="topbar"><div class="logo"><div class="logo-mark"><span>★</span></div><div class="logo-word">BINGO <span>LIVE</span><small>THE PARTY IS ON</small></div></div><div class="row topbar-actions">${S.role?'<button class="btn ghost mini home-action" data-act="leave" title="Return home">⌂ Home</button>':''}</div></header>`}
function renderLanding(){
 document.body.classList.add('on-landing');
 if(new URLSearchParams(location.search).get('assistant')==='1')return renderAssistantInviteLanding();
 const params=new URLSearchParams(location.search);
 const roomFromUrl=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
 const invited=!!roomFromUrl;
 el('app').innerHTML=topBarHtml()+`<section class="landing-intro"><span class="eyebrow">LET'S PLAY!</span><h1 class="heading">It's <span style="color:var(--gold)">BINGO NIGHT!</span></h1><p class="muted" style="max-width:640px">Your lucky card. Big prize rounds. All the fun in one place.</p></section>
 <div class="landing-grid landing-v7">
  <div class="card pad stack landing-host-card">
   <div class="eyebrow">FOR THE HOST</div>
   <h2 class="section-title">Bring everyone together</h2>
   <p class="soft">Create a free-play room, invite your guests, and run the game.</p>
   <button class="btn block landing-primary" data-act="create-live">▶ Start Live Game</button>
   <div class="landing-or"><span>Want to test it first?</span></div>
   <button class="btn secondary block landing-demo" data-act="create-demo">✦ Try Demo</button>
   <p class="soft landing-mode-note">Demo works in this browser. Live games let guests join on their own phones.</p>
   ${!onlineConfigured()?'<p class="soft landing-setup-notice">Live games need a one-time setup before the first event.</p>':''}
  </div>
  <div class="card pad stack landing-guest-card">
   <div class="eyebrow">FOR THE GUEST</div>
   <h2 class="section-title">Join the fun</h2>
   <p class="soft">${invited?'You have been invited! Enter your name to join.':'Scan the host’s QR code or enter a room code.'}</p>
   <form id="join-form" class="stack">
    <div class="field"><label for="room-input">Room code</label><input class="input" id="room-input" name="room" required maxlength="8" autocomplete="off" autocapitalize="characters" value="${safe(roomFromUrl)}" placeholder="ABC123"></div>
    <div class="field"><label for="name-input">Your name</label><input class="input" id="name-input" name="name" required maxlength="30" placeholder="Enter your name" autocomplete="name"></div>
    <button class="btn block" type="submit">Join Game →</button>
    <p class="soft landing-mode-note">Just enter your code and name. Your game will open automatically.</p>
   </form>
  </div>
 </div>
`;
}
// QR links carry a room hint; manually typed codes automatically find the correct game.
function detectJoinMode(id){
 const params=new URLSearchParams(location.search);
 const linkedId=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
 const hint=linkedId===id?params.get('mode'):null;
 if(hint==='demo'||hint==='firebase')return hint;
 if(demoRead(id))return 'demo';
 return 'firebase';
}

function joinLink(){if(location.protocol==='file:')return location.href.split('?')[0]+'?room='+encodeURIComponent(S.roomId)+'&mode='+S.mode;return location.origin+location.pathname+'?room='+encodeURIComponent(S.roomId)+'&mode='+S.mode}
const GUIDE_VARIANTS={
 line:[...Array.from({length:5},(_,r)=>[0,1,2,3,4].map(c=>r*5+c)),...Array.from({length:5},(_,c)=>[0,1,2,3,4].map(r=>r*5+c)),[0,6,12,18,24],[4,8,12,16,20]],
 row:Array.from({length:5},(_,r)=>[0,1,2,3,4].map(c=>r*5+c)),
 col:Array.from({length:5},(_,c)=>[0,1,2,3,4].map(r=>r*5+c)),
 diagonal:[[0,6,12,18,24],[4,8,12,16,20]],
 ...Object.fromEntries(Object.entries(CELLS).map(([k,v])=>[k,[v]]))
};
function guideWayName(pattern,index){
 if(pattern==='line')return index<5?'Row '+(index+1):index<10?'Column '+(index-4):index===10?'Diagonal ↘':'Diagonal ↙';
 if(pattern==='row')return 'Row '+(index+1);
 if(pattern==='col')return 'Column '+(index+1);
 if(pattern==='diagonal')return index===0?'Diagonal ↘':'Diagonal ↙';
 return PATS[pattern]||'Winning pattern';
}
function showPatternGuide(page=0){
 const st=S.room?.public?.stage;if(!st)return;
 if(isStandingStage(st)){
  const direction=st.lmsRule==='miss'?'Stay standing only if your card/number MATCHES the latest ball. If it does NOT match, sit down.':'Stay standing if the new ball does NOT appear on your card/number. If it MATCHES, sit down.';
  const source=st.lmsSource==='number'?'Watch only your personal lucky number.':'Check all 24 numbers on your Bingo card. FREE does not count as a drawn number.';
  const eligible=st.eligibility==='new'?'Only guests without earlier prizes can win.':st.eligibility==='previous'?'Only previous winners are eligible.':'All players are eligible.';
  el('modal-root').innerHTML=`<div class="overlay guide-overlay"><div class="modal guide-modal standing-info-modal" role="dialog" aria-modal="true"><div class="row between"><span class="eyebrow">CURRENT GAME</span><button class="icon-button" data-act="closemodal">✕ Close</button></div><h2>${safe(st.name)}</h2>${prizeBadge(st)}<div class="standing-info-hero"><strong>🧍 LAST PLAYER STANDING</strong><span>${safe(LMS_RULES[st.lmsRule]||LMS_RULES.hit)}</span></div><p><strong>How to play:</strong> ${safe(direction)}</p><p>${safe(source)}</p><p class="soft">${safe(eligible)} Only new balls drawn during THIS stage count for eliminations. The last person standing wins; simultaneous finalists share the win.</p><button class="btn block" data-act="closemodal">Back to game</button></div></div>`;return;
 }
 const valid=GUIDE_VARIANTS[st.pattern]||[];
 const prior=st.eligibility==='new'?'Only guests who have not won yet.':st.eligibility==='previous'?'Only guests who already won a previous prize.':'All guests can win.';
 const perPage=window.matchMedia('(max-width:680px), (max-height:550px)').matches?4:12;
 const totalPages=Math.max(1,Math.ceil(valid.length/perPage));
 page=Math.max(0,Math.min(totalPages-1,page));S.guidePage=page;
 const start=page*perPage,show=valid.slice(start,start+perPage);
 const illustrations=show.map((group,i)=>`<div class="guide-mini" aria-label="${safe(guideWayName(st.pattern,start+i))}"><div class="guide-five">${Array.from({length:25},(_,n)=>`<span class="${group.includes(n)?'on':''}">${n===12?'★':''}</span>`).join('')}</div><span class="guide-mini-title">${safe(guideWayName(st.pattern,start+i))}</span></div>`).join('');
 const pages=totalPages>1?`<div class="guide-pagination"><button class="icon-button" data-act="guide-prev" ${page===0?'disabled':''} aria-label="Previous winning patterns">← Previous</button><span>${start+1}–${Math.min(start+perPage,valid.length)} of ${valid.length} examples</span><button class="icon-button" data-act="guide-next" ${page===totalPages-1?'disabled':''} aria-label="Next winning patterns">Next →</button></div>`:'';
 el('modal-root').innerHTML=`<div class="overlay guide-overlay"><div class="modal guide-modal" role="dialog" aria-modal="true" aria-label="Winning pattern"><div class="row between guide-top"><span class="eyebrow">CURRENT PRIZE</span><button class="icon-button" data-act="closemodal" aria-label="Close">✕ Close</button></div><h2>${safe(st.name)}</h2>${prizeBadge(st)}<p class="guide-summary"><strong>${safe(PATS[st.pattern]||'Bingo')}</strong> · ${valid.length} valid ${valid.length===1?'way':'ways'} to win</p><p class="soft guide-directions">${safe(prior)} Only officially called numbers count.</p><div class="guide-scroll ${valid.length===1?'one':'multi'} ${show.length<=4?'few':''}">${illustrations}</div>${pages}<button class="btn block guide-back" data-act="closemodal">Back to game</button></div></div>`;
}

// Three host display views. The board is visual-only; the official draw sequence never changes.
const BOARD_VIEWS={classic:'All 75',grouped:'B I N G O',called:'Called Focus'};
function boardViewButtons(){

 return `<div class="board-view-controls" role="group" aria-label="Number board view">${Object.entries(BOARD_VIEWS).map(([id,label])=>`<button type="button" class="board-view-btn ${current===id?'active':''}" data-act="board-view" data-view="${id}" aria-pressed="${current===id}" title="${label} number board">${label}</button>`).join('')}</div>`;
}
function numberTile(n,called,last){return `<div class="number ${called.has(n)?'hit':''} ${last===n?'recent':''}" data-n="${n}" title="${ball(n)}">${n}</div>`}
function numBoard(pub){
 const called=new Set(pub.called||[]),last=Number(pub.last)||0;
 const view=BOARD_VIEWS[S.boardView]?S.boardView:'classic';
 if(view==='classic')return `<div class="number-board-wrap board-view-classic" data-board-view="classic"><div class="number-grid">${Array.from({length:75},(_,i)=>numberTile(i+1,called,last)).join('')}</div></div>`;
 const letters='BINGO';
 return `<div class="number-board-wrap board-view-${view}" data-board-view="${view}"><div class="bingo-number-groups">${Array.from({length:5},(_,i)=>{
  const start=i*15+1,end=start+14;
  return `<section class="bingo-number-group" aria-label="${letters[i]} numbers ${start} to ${end}"><div class="bingo-group-title"><strong>${letters[i]}</strong><span>${start}–${end}</span></div><div class="bingo-number-tiles">${Array.from({length:15},(_,j)=>numberTile(start+j,called,last)).join('')}</div></section>`;
 }).join('')}</div></div>`;
}
function setBoardView(view){
 if(S.role!=='host'||!BOARD_VIEWS[view])return;
 S.boardView=view;
 const board=el('host-num-board');
 if(board&&S.room){
  const pub=S.room.public;
  const preview=Number(S.hostPreviewNumber)||0;

  if(!(r.public.called||[]).length||standingStageCalls(r.public)===0||awardList(r,st.id).length)return {awards:[],rejections:[],cleared:[]};
  const survivors=standingSurvivors(r),past=standingSurvivors(r,(r.public.called||[]).length-1);

  const finalists=survivors.length===1?survivors:survivors.length===0&&past.length<=5?past:[];
  return {awards:finalists.length?finalists.map(p=>({resetVersion:roundVersion(r.public),uid:p.uid,name:p.name,stageId:st.id,stageName:st.name,prizeAmount:Number(st.prizeAmount)||0,prizeDistribution:st.prizeDistribution||'each',drawCount:(r.public.called||[]).length,at:Date.now(),lastStanding:true,simultaneousTie:survivors.length===0})):[],rejections:[],cleared:[]};

 // A delayed manual claim may still tie with the cutoff draw, rather than
 // being denied only because another guest's internet request arrived first.
 const cutoff=reached?have[Math.min(st.limit,have.length)-1].drawCount:Infinity;
 const awards=[],rejections=[],cleared=[];

  if(!isEligible(r,p,st)||awardList(r,st.id).some(w=>w.uid===p.uid)||(r.candidates?.[p.uid]&&validRoundAward(r.candidates[p.uid],r.public)))continue;

async function reconcileHost(){if(S.reconciling||S.actionBusy||S.drawBusy||S.role!=='host'||!S.room)return;S.reconciling=true;try{const r=S.room;if(!r.public?.theme){await patchHost({'public/theme':{palette:S.palette,appearance:S.appearance},'public/updatedAt':Math.max(Date.now(),Number(r.public.updatedAt||0)+1)});return}if(r.public?.drawing){const elapsed=Date.now()-Number(r.public.drawing.startedAt||0);if(elapsed>9000){await patchHost({'public/drawing':null,'public/updatedAt':Math.max(Date.now(),Number(r.public.updatedAt||0)+1)})}else{clearTimeout(S.reconcileTimer);S.reconcileTimer=setTimeout(reconcileHost,Math.max(500,9100-elapsed))}return}const missingLuck=Object.entries(r.players||{}).filter(([,p])=>Array.isArray(p.card)&&!Number(p.luckyNumber));
 if(missingLuck.length){await patchHost(Object.fromEntries(missingLuck.map(([uid])=>['players/'+uid+'/luckyNumber',1+randomInt(75)])));return}
 const missingSlots=Object.entries(r.players||{}).filter(([,p])=>Array.isArray(p.card)&&!p.slot);if(missingSlots.length){const taken=new Set(Object.values(r.players||{}).map(p=>Number(p.slot)||0));const fixes={};let next=1;for(const [uid] of missingSlots){while(taken.has(next))next++;fixes['players/'+uid+'/slot']=next;taken.add(next)}await patchHost(fixes);return}const pending=Object.entries(r.players||{}).filter(([,p])=>!p.card&&!p.rejected);if(pending.length){const unique=new Set(players(r).map(p=>cardKey(p.card))),changes={};let count=players(r).length;for(const [uid] of pending){if(count>=100){changes['players/'+uid+'/rejected']=true;continue}let card,tries=0;do{card=makeCard();tries++}while(unique.has(cardKey(card))&&tries<50);unique.add(cardKey(card));changes['players/'+uid+'/card']=card;changes['players/'+uid+'/luckyNumber']=1+randomInt(75);changes['players/'+uid+'/slot']=count+1;count++}changes['public/playerCount']=count;changes['public/updatedAt']=Date.now();await patchHost(changes);return}const {awards,rejections,cleared}=findNewAwards(r);if(!awards.length&&!cleared.length)return;const st=currentStage(r),changes={};for(const uid of cleared){changes['claims/'+uid]=null;if(rejections.includes(uid))changes['players/'+uid+'/claimFeedback']='Invalid BINGO. Mark only officially called numbers.'}if(awards.length){if(st.approval==='auto'){for(const w of awards)changes[`winners/${st.id}/${w.uid}`]=w;changes['public/winnerList']=[...awardList(r,st.id),...awards].sort((a,b)=>a.drawCount-b.drawCount)}else{for(const w of awards)changes['candidates/'+w.uid]=w}}if(Object.keys(changes).length&&!S.actionBusy&&roundVersion(S.room?.public)===roundVersion(r.public))await patchHost(changes)}catch(e){toast('Having trouble updating the game. Retrying…',true)}finally{S.reconciling=false}}
function modifiedPub(r,newFields){return {...r.public,...newFields,updatedAt:Math.max(Date.now(),Number(r.public?.updatedAt||0)+1)}}
async function performDraw(){
 if(S.role!=='host'||S.drawBusy||S.drawSuspenseActive||S.room?.public?.status!=='playing'||S.room?.public?.drawing)return;
 const startedRoom=S.room,startedPub=startedRoom.public;
 const remaining=Array.from({length:75},(_,i)=>i+1).filter(n=>!(startedPub.called||[]).includes(n));
 if(!remaining.length){toast('All 75 balls have been drawn.');return}
 const number=remaining[randomInt(remaining.length)];
 const id='draw_'+Date.now()+'_'+code();
 const epoch=roundVersion(startedPub),stageId=startedPub.stage?.id;
 S.drawBusy=true;audioReady();beginDrawAnimation();
 const startedAt=Date.now();
 try{
  // Drawing state has NO secret number. Guests cannot see the result early.
  if(S.mode==='firebase'){
   const ref=S.db.ref('rooms/'+S.roomId+'/public/drawing');
   const claim=await ref.transaction(existing=>existing===null?{id,startedAt,stageId,resetVersion:epoch}:undefined,undefined,false);
   if(!claim.committed)throw Error('Another draw has already started.');
   await S.db.ref('rooms/'+S.roomId+'/public/updatedAt').set(Math.max(Date.now(),Number(startedPub.updatedAt||0)+1));
  }else await patchHost({'public/drawing':{id,startedAt,stageId,resetVersion:epoch},'public/updatedAt':Math.max(Date.now(),Number(startedPub.updatedAt||0)+1)});
  await new Promise(resolve=>setTimeout(resolve,Math.max(0,DRAW_REVEAL_MS+130-(Date.now()-startedAt))));
  if(S.role!=='host'||!S.room||roundVersion(S.room.public)!==epoch||S.room.public.stage?.id!==stageId||S.room.public.status!=='playing'||S.room.public.drawing?.id!==id){throw Error('Draw was interrupted. Nothing new was called.')}
  // The host sees the reveal FIRST, then the official result is sent to guests.
  S.drawRevealReady=true;S.drawAwaitedNumber=number;
  finishDrawAnimation();
  // Give the host display a moment to paint the reveal before guests receive it.
  await new Promise(resolve=>setTimeout(resolve,85));
  const room=S.room;
  await patchHost({public:modifiedPub(room,{called:[...(room.public.called||[]),number],last:number,lastDrawAt:Date.now(),drawing:null})});
  return true;
 }catch(e){
  cancelDrawAnimation();S.hostPreviewNumber=0;
  try{if(S.role==='host'&&S.room?.public?.drawing?.id===id)await patchHost({'public/drawing':null,'public/updatedAt':Math.max(Date.now(),Number(S.room.public.updatedAt||0)+1)})}catch(_e){}
  if(S.role==='host'&&S.room)updateHostUI();
  toast('Draw could not finish: '+(e?.message||'Please try again.'),true);
  return false;
 }finally{S.drawBusy=false;if(S.role==='host'&&S.room)updateHostUI()}
}

 if((pub.called||[]).length||previous.length){history.push({at:Date.now(),drawCount:(pub.called||[]).length,awards:previous.map(w=>({name:w.name,stageName:w.stageName||r.stages.find(st=>st.id===w.stageId)?.name||'Bingo',prizeAmount:w.prizeAmount||0,prizeDistribution:w.prizeDistribution||'each'}))});}
 changes={winners:null,candidates:null,claims:null,marks:null,public:modifiedPub(r,{called:[],last:null,stageIndex:0,stage:r.stages[0],stageStartDrawCount:0,winnerList:[],status:'lobby',drawing:null,lastDrawAt:0,resetVersion:roundVersion(pub)+1,pastRoundResults:history.slice(-12)})};break;

case 'adddemo':{if(S.mode!=='demo')return;const names=['Alex','Bea','Carlo','Dani','Ella','Francis','Gina','Hugo','Ivy','Jules','Kai','Luna'];let idx=0;for(const name of names){const uid='sim_'+code()+'_'+idx;changes['players/'+uid]={name:`${name} (Demo)`,uid,joinedAt:Date.now()+idx++}}break}
}if(Object.keys(changes).length)await patchHost(changes);if(act==='nextstage'||act==='selectstage')toast('Next prize! Called numbers, marks and cards are unchanged.');if(act==='resetdraws')toast('Reset complete. Zero called numbers. Press Start when ready.');}catch(e){toast('Unable to complete that action. Please try again.',true)}finally{S.actionBusy=false;clearTimeout(S.reconcileTimer);S.reconcileTimer=setTimeout(reconcileHost,50)}}
async function saveStage(form){

async function assistantCommand(type,payload={}){
 const perm=ASSISTANT_ACTION_PERM[type];if(!assistantCan(perm))return toast('This control is not permitted by Main Host.',true);
 if(!assistantReady())return toast('Main Host is offline. Reconnect before sending controls.',true);
 if(S.assistantBusy)return;
 const raw=JSON.stringify(payload),cmd={type,payload:raw,createdAt:Date.now(),epoch:roundVersion(S.room?.public)};
 if(raw.length>2400)return toast('Settings request is too large.',true);
 S.assistantBusy=true;
 try{
  if(S.mode==='demo'){const id='cmd_'+Date.now()+'_'+code();patchDemo({['assistantCommands/'+S.uid+'/'+id]:cmd});}
  else{await S.db.ref('rooms/'+S.roomId+'/assistantCommands/'+S.uid).push(cmd)}
  toast('Request sent to Main Host…');
 }catch(e){S.assistantBusy=false;toast('Request not sent: '+friendlyError(e),true)}
 // A pending request never modifies client game data on its own.
 setTimeout(()=>{S.assistantBusy=false},2500);
}
async function runAssistantCommand(uid,id,cmd){
 if(S.role!=='host'||!S.room)return;
 const perm=ASSISTANT_ACTION_PERM[cmd?.type],profile=S.room.assistants?.[uid],results=S.room.assistantResults?.[uid]||{};
 if(!perm||results[id])return;
 // Restrict by current authorization AND reset round; delayed commands are rejected.
 let error='';const age=Date.now()-Number(cmd.createdAt||0);
 if(profile?.status!=='approved'||profile?.permissions?.[perm]!==true)error='Access is no longer permitted.';
 else if(age>15000||age< -3000)error='Request expired; try again.';
 else if(Number(cmd.epoch)!==roundVersion(S.room.public))error='Game was reset. Please refresh.';
 else if(cmd.type==='draw'&&Number(cmd.createdAt)<=Number(S.room.public.lastDrawAt||0))error='This draw request was sent before the previous draw finished.';
 let data={};try{data=JSON.parse(cmd.payload||'{}')}catch(e){error='Invalid request data.'}
 let claimed=false;
 const path='assistantResults/'+uid+'/'+id;
 if(S.mode==='demo'){
  if(!S.room.assistantResults?.[uid]?.[id]){patchDemo({[path]:{status:'processing',at:Date.now()}});claimed=true}
 }else{
  try{const tx=await S.db.ref('rooms/'+S.roomId+'/'+path).transaction(cur=>cur===null?{status:'processing',at:Date.now()}:undefined,undefined,false);claimed=tx.committed}catch(e){return}
 }
 if(!claimed)return;
 let message='Done — action applied.';
 try{
  if(error)throw Error(error);
  const p=S.room.public;
  if(cmd.type==='draw'){
   if(p.status!=='playing'||p.drawing||S.drawBusy||S.drawSuspenseActive||S.actionBusy)throw Error('Draw already in progress, or game not started.');
   if(!await performDraw())throw Error('Draw was not completed.');message='Number draw completed.';
  }else if(['start','togglepause','nextstage','resetdraws','end','reopen','approve','selectstage'].includes(cmd.type)){
   if(cmd.type==='start'&&p.status!=='lobby')throw Error('Game is not in lobby.');
   if(cmd.type==='nextstage'&&(p.drawing||p.stageIndex>=S.room.stages.length-1))throw Error('Next prize is not available.');
   if(cmd.type==='selectstage'&&(!Number.isInteger(data.index)||data.index<=p.stageIndex||data.index>=S.room.stages.length))throw Error('Invalid stage.');
   if(cmd.type==='resetdraws'&&p.drawing)throw Error('Finish drawing before reset.');
   await hostAction(cmd.type,cmd.type==='selectstage'?data.index:undefined);
  }else if(cmd.type==='stageSave'){
   const st=cleanAssistantStage(data.stage),idx=data.editIndex;
   const r=S.room,stages=clone(r.stages);
   if(Number.isInteger(idx)){
    if(!stageChangeAllowed(r,idx)||!stages[idx]||stages[idx].id!==st.id)throw Error('Stage is locked or changed.');stages[idx]=st;
   }else{st.id='stage'+Date.now()+'_'+code();stages.push(st)}
   const changes={stages};if(Number.isInteger(idx)&&idx===r.public.stageIndex)changes.public=modifiedPub(r,{stage:st});await patchHost(changes);message='Prize stage saved.';
  }else if(cmd.type==='stageMove'||cmd.type==='stageDelete'){
   const r=S.room,idx=r.stages.findIndex(st=>st.id===data.id);
   if(idx<0||!stageChangeAllowed(r,idx)||cmd.type==='stageDelete'&&r.stages.length<2)throw Error('Stage cannot be changed.');
   if(cmd.type==='stageMove'&&(![-1,1].includes(data.step)||!stageChangeAllowed(r,idx+data.step)||idx+data.step<0||idx+data.step>=r.stages.length))throw Error('Move is not allowed.');
   const stages=clone(r.stages);
   if(cmd.type==='stageDelete')stages.splice(idx,1);else [stages[idx],stages[idx+data.step]]=[stages[idx+data.step],stages[idx]];
   const changes={stages};if(stagePlanEditable(r))changes.public=modifiedPub(r,{stageIndex:Math.min(r.public.stageIndex,stages.length-1),stage:stages[Math.min(r.public.stageIndex,stages.length-1)]});await patchHost(changes);
   message=cmd.type==='stageDelete'?'Stage deleted.':'Stage order updated.';
  }else if(cmd.type==='theme'){
   if(!HOST_PALETTES[data.palette]||!['light','dark'].includes(data.appearance))throw Error('Invalid theme.');
   S.palette=data.palette;S.appearance=data.appearance;store('bingolive_palette',S.palette);store('bingolive_appearance',S.appearance);applyTheme();await publishHostTheme();message='Host theme updated.';
  }else if(cmd.type==='music'||cmd.type==='voice'||cmd.type==='sound'){
   const key=data.key,val=data.value;
   if(key==='musicOn'&&val==='toggle')S.musicOn=!S.musicOn;
   else if(key==='voiceOn'&&val==='toggle')S.voiceOn=!S.voiceOn;
   else if(key==='soundOn'&&val==='toggle'){S.soundOn=!S.soundOn;store('bingolive_sound_host',S.soundOn);if(!S.soundOn)stopMixTrack()}
   else if(key==='musicVolume'&&Number.isFinite(Number(val))&&Number(val)>=0&&Number(val)<=100)S.musicVolume=Number(val);
   else if(key==='musicStyle'&&MUSIC_STYLES[val])S.musicStyle=val;
   else if(key==='musicMood'&&['chill','hype'].includes(val))S.musicMood=val;
   else if(key==='voicePreset'&&VOICE_PRESETS[val])S.voicePreset=val;
   else throw Error('Invalid audio setting.');
   musicOptionsSave();rememberVoiceOptions();store('bingolive_voice',S.voiceOn);syncHostMusic();await publishHostAudio();message='Host audio settings updated.';
  }else throw Error('Unsupported action.');
  await patchHost({[path]:{status:'success',message,at:Date.now()}});
 }catch(e){try{await patchHost({[path]:{status:'error',message:e.message||'Action not completed.',at:Date.now()}})}catch(_e){}}
}
function cleanAssistantStage(stage){
 const amount=Number(stage?.prizeAmount),name=trimName(stage?.name);
 if(!name||!Number.isFinite(amount)||amount<0||amount>100000000||!PATS[stage.pattern])throw Error('Invalid stage name, pattern or prize.');
 if(!['all','new','previous'].includes(stage.eligibility)||![0,1,3].includes(Number(stage.limit)))throw Error('Invalid stage rules.');
 if(!['auto','hybrid','manual'].includes(stage.markMode)||!['auto','host'].includes(stage.approval))throw Error('Invalid stage settings.');
 return {id:String(stage.id||'').slice(0,70),name,gameType:stage.gameType==='laststanding'?'laststanding':'bingo',lmsRule:stage.lmsRule==='miss'?'miss':'hit',lmsSource:stage.lmsSource==='number'?'number':'card',pattern:stage.pattern,eligibility:stage.eligibility,limit:Number(stage.limit),markMode:stage.markMode,approval:stage.approval,prizeAmount:Math.round(amount*100)/100,prizeDistribution:stage.prizeDistribution==='pool'?'pool':'each'};
}
function processAssistantCommands(){
 if(S.role!=='host'||S.assistantCommandBusy||!S.room?.assistantCommands||S.actionBusy||S.drawBusy)return;
 const queued=Object.entries(S.room.assistantCommands).flatMap(([uid,cmds])=>Object.entries(cmds||{}).filter(([id])=>!S.room.assistantResults?.[uid]?.[id]).map(([id,cmd])=>({uid,id,cmd}))).sort((a,b)=>(a.cmd.createdAt||0)-(b.cmd.createdAt||0));
 if(!queued.length)return;
 S.assistantCommandBusy=true;
 (async()=>{for(const item of queued){await runAssistantCommand(item.uid,item.id,item.cmd)} })().finally(()=>{S.assistantCommandBusy=false;setTimeout(processAssistantCommands,150)});
}

if(act==='resetdraws')return confirmDialog('Reset Draws?','Clear ALL called numbers and ALL guest marks (including manual marks), then return to Stage 1. Everyone keeps the SAME Bingo card numbers. Previous prize results are saved in Past Winners.','Reset to zero',async()=>{clearWinnerScreen();await hostAction('resetdraws')});
if(act==='end')return confirmDialog('End Event?','The event will stop. Player cards, drawn numbers and winner history will remain saved.','End Event',()=>hostAction('end'));
if(act==='selectstage'){const n=Number(btn.dataset.index);return confirmDialog('Switch prize stage?','Current card assignments, marked numbers, and all drawn balls will remain intact.','Continue',()=>hostAction('selectstage',n))}
if(act==='nextstage')return confirmDialog('Continue to next prize?','Use existing drawn numbers and the same cards. All eligible cards will be checked against the next pattern.','Continue',()=>hostAction('nextstage'));
if(act==='start'){musicUnlock();return hostAction(act)}if(act==='draw')return performDraw();return hostAction(act)
}
S.voicePreset=VOICE_PRESETS[load('bingolive_voice_preset','host')]?load('bingolive_voice_preset','host'):'host';
S.voiceURI=String(load('bingolive_voice_uri','auto')||'auto');
S.musicOn=load('bingolive_music_on',true)!==false;
S.musicStyle=MUSIC_STYLES[load('bingolive_music_style','game')]?load('bingolive_music_style','game'):'game';
S.musicMood=['chill','hype'].includes(load('bingolive_music_mood','chill'))?load('bingolive_music_mood','chill'):'chill';
S.musicVolume=Math.min(100,Math.max(0,Number(load('bingolive_music_volume',30))||0));
S.musicCustomUrl=musicTrackAllowedUrl(load('bingolive_music_custom_url',''));
applyTheme();
document.addEventListener('keydown',e=>{
 if(e.code==='Escape'&&el('modal-root')?.querySelector('.overlay')){e.preventDefault();el('modal-root').innerHTML='';return}
 if(S.role!=='host'||!S.room||e.altKey||e.ctrlKey||e.metaKey)return;
 const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
 if(e.code==='KeyQ'&&!typing){e.preventDefault();toggleJoinQR();return}
 if(document.querySelector('.overlay')||typing||document.querySelector('.winner-celebration'))return;
 if(e.code==='Space'){e.preventDefault();if(S.room.public.status==='playing')runAct('draw',null)}
 else if(e.code==='KeyP'){e.preventDefault();if(['playing','paused'].includes(S.room.public.status))runAct('togglepause',null)}
 else if(e.code==='KeyR'){e.preventDefault();runAct('resetdraws',null)}
 else if(e.code==='KeyN'||e.code==='ArrowRight'){e.preventDefault();if(S.room.public.stageIndex<S.room.stages.length-1)runAct('nextstage',null)}
 else if(e.code==='KeyV'&&S.focusMode==='host'){e.preventDefault();const views=Object.keys(BOARD_VIEWS);setBoardView(views[(views.indexOf(S.boardView)+1)%views.length])}
 else if(e.code==='KeyT'){e.preventDefault();runAct('themes',null)}
 else if(e.code==='KeyI'){e.preventDefault();runAct('pattern-info',null)}
});
if('speechSynthesis' in window){speechSynthesis.addEventListener?.('voiceschanged',()=>{if(el('modal-root')?.querySelector('[data-overlay-type=voice-picker]')&&!document.activeElement?.matches('#system-voice-select'))showVoicePicker()})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();runAct(b.dataset.act,b).catch(err=>toast(err.message,true))}});
document.addEventListener('input',e=>{if(e.target?.id==='music-volume'){S.musicVolume=Math.min(100,Math.max(0,Number(e.target.value)||0));musicOptionsSave();const val=el('music-volume-value');if(val)val.textContent=S.musicVolume+'%';syncHostMusic()}});
document.addEventListener('change',e=>{if(e.target?.id==='system-voice-select'){S.voiceURI=e.target.value;rememberVoiceOptions();const feedback=el('voice-option-feedback');if(feedback)feedback.textContent='Voice selected. Press Preview to hear it.'}if(e.target?.dataset?.assistantAudio){assistantCommand('music',{key:e.target.dataset.assistantAudio,value:e.target.value})}if(e.target?.id==='music-volume'&&S.role==='host')publishHostAudio();if(e.target?.name==='gameType')syncStageEditorFields();if(e.target?.id==='card-accent-picker'){S.cardAccent=e.target.value;store('bingolive_card_accent',S.cardAccent);S.cardStyle='custom';store('bingolive_card_style','custom');applyTheme();showCardStyles()}});
document.addEventListener('submit',e=>{if(e.target.id==='assistant-join-form'){e.preventDefault();const f=new FormData(e.target),id=String(f.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8),name=trimName(f.get('name'));if(!id||!name)return toast('Enter name and room code.',true);return requestAssistant(id,name,detectJoinMode(id))}if(e.target.classList.contains('assistant-permission-form')){e.preventDefault();const f=new FormData(e.target),perms=Object.fromEntries(Object.keys(ASSISTANT_PERMISSIONS).map(k=>[k,f.get(k)==='on']));return updateAssistantApproval(e.target.dataset.uid,perms)}if(e.target.id==='join-form'){e.preventDefault();const f=new FormData(e.target);const name=trimName(f.get('name')),id=String(f.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!id||!name)return toast('Enter your room code and name.',true);joinRoom(id,name,detectJoinMode(id))}if(e.target.id==='stage-form'){e.preventDefault();saveStage(e.target)}});
(async function boot(){const params=new URLSearchParams(location.search);const session=(()=>{try{return JSON.parse(sessionStorage.getItem('bingolive_session'))}catch(e){return null}})();if(session?.role==='assistant'&&session?.roomId){S.mode=session.mode;S.role='assistant';S.roomId=session.roomId;S.uid=session.uid;try{if(S.mode==='demo'){watchDemo()}else{await authorize();S.db=firebase.database();S.assistantLiveAttached=false;connectAssistantWatch()}return}catch(e){S.role='';toast('Assistant session could not be restored.',true)}}if(session?.role==='host'&&session?.roomId){S.mode=session.mode;S.role='host';S.soundOn=load('bingolive_sound_host',true);S.voiceOn=load('bingolive_voice',false);S.roomId=session.roomId;try{if(S.mode==='demo'){S.uid=demoRead(S.roomId)?.hostUid;watchDemo()}else{await authorize();S.db=firebase.database();watchHost()}return}catch(e){toast('Could not restore your game. Please try again.',true);S.role=''}}if(session?.role==='player'&&session?.roomId){S.mode=session.mode;S.role='player';S.soundOn=load('bingolive_sound_player',false);S.roomId=session.roomId;try{if(S.mode==='demo'){const room=demoRead(S.roomId);if(!room)throw Error('Demo room missing');S.uid=session.uid;if(!S.uid)throw Error('Missing guest identity');S.player=room.players[S.uid];watchDemo()}else{await authorize();S.player=await rest('rooms/'+S.roomId+'/players/'+S.uid);startPolling()}return}catch(e){S.role=''}}render();if(params.has('room'))setTimeout(()=>el('name-input')?.focus(),150)})();
</script>
</body>
</html>
